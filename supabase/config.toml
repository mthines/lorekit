# Supabase local development configuration.
# Run `supabase link --project-ref pqokxlhvnosogizsjztg` to link to your remote project.
# This file is used by the Supabase CLI for local development.
# See: https://supabase.com/docs/guides/cli/config

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://127.0.0.1:3001"
additional_redirect_urls = ["https://127.0.0.1:3001", "http://localhost:3001"]
jwt_expiry = 86400
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6
password_requirements = ""

[auth.external.github]
enabled = false
client_id = "env(SUPABASE_AUTH_GITHUB_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GITHUB_SECRET)"
redirect_uri = ""

[edge_runtime]
enabled = true
# per_worker keeps one warm worker instead of cold-starting on every request
# (the "oneshot" dev default), which is what CI integration tests need — the
# smoke suite makes many sequential calls and oneshot re-downloads deps each
# time. Hot-reload local dev uses `supabase functions serve` instead.
policy = "per_worker"
inspector_port = 8083

# Both functions handle their own auth (API tokens / JWT inside the function),
# so the gateway must not require a JWT. This mirrors the `--no-verify-jwt` flag
# used when deploying, and lets `supabase start` serve them for CI integration
# tests without a gateway 401.
[functions.mcp]
verify_jwt = false

[functions.health]
verify_jwt = false

# memories/orgs/openapi are the three functions that import `@lorekit/schemas/*`
# and `zod` as BARE specifiers, so they are the three that need the import map
# declared. It is not implicit: older Supabase CLI versions auto-discovered
# `supabase/functions/import_map.json`, current ones do not, and because
# `setup-cli` here pins `version: latest` the behaviour changed under us with no
# commit to blame. Without this line Deno never sees the map and dies at boot
# with `Relative import path "@lorekit/schemas/memory" not prefixed with / or
# ./ or ../` — a BOOT_ERROR, not an import error, which is why it surfaced only
# as an opaque 503 from the REST passthrough.
#
# mcp/health deliberately have no entry: they are self-contained (only
# `npm:@supabase/supabase-js@2`, a fully-qualified specifier that needs no map),
# per the "Edge Function is self-contained Deno" decision in CLAUDE.md. That is
# also why those two kept booting fine while these three did not.
#
# The path is relative to this file's directory (`supabase/`).
# `edge-import-map.spec.ts` fails the build if a function starts using a bare
# specifier without an entry here.
[functions.memories]
verify_jwt = false
import_map = "./functions/import_map.json"
[functions.memories.secrets]

[functions.orgs]
verify_jwt = false
import_map = "./functions/import_map.json"
[functions.orgs.secrets]

[functions.openapi]
verify_jwt = false
import_map = "./functions/import_map.json"
[functions.openapi.secrets]

[analytics]
enabled = true
port = 54327
backend = "postgres"
