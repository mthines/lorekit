# Supabase local development configuration.
# Run `supabase link --project-ref pqokxlhvnosogizsjztg` to link to your remote project.
# This file is used by the Supabase CLI for local development.
# See: https://supabase.com/docs/guides/cli/config

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://127.0.0.1:3001"
additional_redirect_urls = ["https://127.0.0.1:3001", "http://localhost:3001"]
jwt_expiry = 86400
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6
password_requirements = ""

[auth.external.github]
enabled = false
client_id = "env(SUPABASE_AUTH_GITHUB_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GITHUB_SECRET)"
redirect_uri = ""

[edge_runtime]
enabled = true
# per_worker keeps one warm worker instead of cold-starting on every request
# (the "oneshot" dev default), which is what CI integration tests need — the
# smoke suite makes many sequential calls and oneshot re-downloads deps each
# time. Hot-reload local dev uses `supabase functions serve` instead.
policy = "per_worker"
inspector_port = 8083

# Both functions handle their own auth (API tokens / JWT inside the function),
# so the gateway must not require a JWT. This mirrors the `--no-verify-jwt` flag
# used when deploying, and lets `supabase start` serve them for CI integration
# tests without a gateway 401.
#
# No SERVICE_NAME secrets here on purpose. Every function is one logical
# service, `api`, hard-coded in `_shared/otel.ts`; the function is identified by
# `faas.name` and the span name. Supabase secrets are project-wide rather than
# per-function, so a per-function SERVICE_NAME could never have worked anyway.
[functions.mcp]
verify_jwt = false

[functions.health]
verify_jwt = false

# No function declares an import map, and none needs one: every specifier under
# `supabase/functions/` is either relative or a fully-qualified `npm:` / `node:`
# one that Deno resolves on its own.
#
# That is deliberate. memories/orgs/openapi used to import `@lorekit/schemas/*`
# and `zod` as BARE specifiers, which only resolve if something hands Deno
# `supabase/functions/import_map.json`. Nothing did — older Supabase CLI
# versions auto-discovered that filename, current ones do not, and `setup-cli`
# pins `version: latest`, so the behaviour changed with no commit to blame. All
# three died at boot with `Relative import path "@lorekit/schemas/memory" not
# prefixed with / or ./ or ../`, surfacing only as an opaque 503 BOOT_ERROR
# through the REST passthrough. Declaring `import_map` per function here was
# tried and did NOT reach the local `supabase start` runtime.
#
# The schemas are now mirrored into `supabase/functions/_shared/schemas/`
# (`node scripts/codegen/sync-edge-schemas.mjs`, guarded by `edge-schema-parity.spec.ts`)
# and imported relatively, matching the `limits.ts` / `permissions.ts` mirrors
# and the "Edge Function is self-contained Deno" decision in CLAUDE.md. mcp and
# health always followed that rule, which is exactly why they never broke.
#
# `edge-bare-specifier.spec.ts` fails the build if a bare specifier reappears.
[functions.memories]
verify_jwt = false

[functions.orgs]
verify_jwt = false

[functions.openapi]
verify_jwt = false

# Public blog like counter — unauthenticated by design (see functions/blog).
[functions.blog]
verify_jwt = false

# Query-level profiling export (see functions/profiling). `verify_jwt = false`
# like every other function — the gateway's JWT check would admit the anon key,
# which is not the bar here: the handler itself requires the SERVICE-ROLE key
# and refuses a user JWT and an `lk_*` token alike, because the counters it
# reads are the whole cluster's rather than any one caller's.
[functions.profiling]
verify_jwt = false

[analytics]
enabled = true
port = 54327
backend = "postgres"
