<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="A scaling strip in three stages. Left: today, a local store of plain markdown files in a folder you own. Middle: you connect the hosted store by running lorekit install and pasting your read-write API key; remote is the default mode, so there is nothing else to set. Right: one unchanged read path that can be handed either store — the local folder in local mode, or a hosted Postgres in remote mode — with the lorekit list command showing both side by side. A label underneath notes your files never move and there is no sync process: the read path never changed, only which store it is handed.">
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#e7ebf2}
    .lbl{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;fill:#8892a4;letter-spacing:.02em}
    .k{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}
  </style>
  <defs>
    <marker id="arM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8892a4"/></marker>
    <marker id="arA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f5a623"/></marker>
  </defs>
  <rect x="0" y="0" width="720" height="300" fill="#0d0e11"/>

  <text x="24" y="28" class="lbl" font-size="11.5">SCALING UP IS ADDITIVE — YOUR FILES NEVER MOVE</text>

  <!-- Stage 1 — local -->
  <text x="24" y="58" class="lbl" font-size="10.5" fill="#34d399">TODAY · LOCAL</text>
  <rect x="24" y="68" width="164" height="112" rx="10" fill="#1a1d24" stroke="#34d399" stroke-opacity="0.5"/>
  <text x="38" y="90" class="k" font-size="10" fill="#34d399">~/.lorekit/</text>
  <rect x="38" y="100" width="136" height="14" rx="3" fill="#34d399" fill-opacity="0.16" stroke="#34d399" stroke-opacity="0.4"/>
  <rect x="38" y="120" width="136" height="14" rx="3" fill="#34d399" fill-opacity="0.16" stroke="#34d399" stroke-opacity="0.4"/>
  <rect x="38" y="140" width="136" height="14" rx="3" fill="#34d399" fill-opacity="0.16" stroke="#34d399" stroke-opacity="0.4"/>
  <text x="38" y="170" class="lbl" font-size="9.5">plain .md files, yours</text>

  <path d="M196,124 L222,124" stroke="#8892a4" stroke-width="1.4" marker-end="url(#arM)"/>

  <!-- Stage 2 — two env vars -->
  <text x="230" y="58" class="lbl" font-size="10.5" fill="#f5a623">YOU ADD A CONNECTION</text>
  <rect x="230" y="68" width="176" height="112" rx="10" fill="#13151a" stroke="#f5a623" stroke-opacity="0.55"/>
  <rect x="244" y="80" width="148" height="18" rx="4" fill="#1a1d24" stroke="#2a2d38"/>
  <text x="252" y="93" class="k" font-size="8.5" fill="#f5a623">lorekit install</text>
  <rect x="244" y="102" width="148" height="18" rx="4" fill="#1a1d24" stroke="#2a2d38"/>
  <text x="252" y="115" class="k" font-size="8.5" fill="#f5a623">paste lk_rw_ key</text>
  <rect x="244" y="124" width="148" height="18" rx="4" fill="#1a1d24" stroke="#2a2d38"/>
  <text x="252" y="137" class="k" font-size="8.5" fill="#f5a623">remote = default</text>
  <text x="244" y="160" class="lbl" font-size="9.5">your files stay put.</text>
  <text x="244" y="172" class="lbl" font-size="9.5">no sync process.</text>

  <path d="M414,124 L440,124" stroke="#f5a623" stroke-width="1.4" marker-end="url(#arA)"/>

  <!-- Stage 3 — one read path, either store -->
  <text x="448" y="58" class="lbl" font-size="10.5" fill="#7c8cf8">ONE READ PATH · EITHER STORE</text>
  <rect x="448" y="68" width="248" height="120" rx="10" fill="#1a1d24" stroke="#7c8cf8" stroke-opacity="0.5"/>
  <rect x="462" y="82" width="102" height="34" rx="6" fill="#13151a" stroke="#34d399" stroke-opacity="0.5"/>
  <text x="513" y="96" text-anchor="middle" class="k" font-size="9" fill="#34d399">local folder</text>
  <text x="513" y="109" text-anchor="middle" class="lbl" font-size="8">still yours</text>
  <rect x="462" y="124" width="102" height="34" rx="6" fill="#13151a" stroke="#7c8cf8" stroke-opacity="0.5"/>
  <text x="513" y="138" text-anchor="middle" class="k" font-size="9" fill="#7c8cf8">hosted Postgres</text>
  <text x="513" y="151" text-anchor="middle" class="lbl" font-size="8">the team's lore</text>
  <path d="M572,99 L594,116" stroke="#34d399" stroke-width="1.3" stroke-opacity="0.7" marker-end="url(#arM)"/>
  <text x="576" y="94" class="lbl" font-size="7.5" fill="#34d399">mode: local</text>
  <path d="M572,141 L594,124" stroke="#7c8cf8" stroke-width="1.3" stroke-opacity="0.7" marker-end="url(#arM)"/>
  <text x="576" y="158" class="lbl" font-size="7.5" fill="#7c8cf8">mode: remote</text>
  <rect x="602" y="98" width="82" height="44" rx="8" fill="#13151a" stroke="#f5a623" stroke-opacity="0.6"/>
  <text x="643" y="116" text-anchor="middle" class="k" font-size="9" font-weight="700" fill="#f5a623">one read</text>
  <text x="643" y="129" text-anchor="middle" class="k" font-size="9" font-weight="700" fill="#f5a623">path</text>
  <text x="462" y="178" class="lbl" font-size="8.5">lorekit list shows both, side by side</text>

  <line x1="24" y1="212" x2="696" y2="212" stroke="#2a2d38"/>
  <text x="24" y="238" class="lbl" font-size="10.5">The read path never changed — only which store it's handed.</text>
  <text x="24" y="256" class="lbl" font-size="10.5">Local was never a toy. It's the base layer.</text>
  <text x="24" y="278" class="lbl" font-size="10" fill="#34d399">Free up to 5,000 stored memories.</text>
</svg>
