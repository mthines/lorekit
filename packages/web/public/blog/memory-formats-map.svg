<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="A grid placing agent memory formats by who writes them and how structured they are. Columns, left to right: a person, the agent, an extractor service. Rows, from least to most structured: plain files, labeled blocks, facts with metadata, typed records and graphs. A person writes AGENTS.md and CLAUDE.md (plain files) and Cursor rules (labeled blocks). The agent writes Anthropic memory-tool files (plain files), Letta blocks (labeled blocks), Copilot Memory and the MCP knowledge graph (facts with metadata), and LangGraph store items and LoreKit records (typed records). An extractor writes Mem0 facts (facts with metadata) and Graphiti edges (typed graphs). A caption notes the placement is rough and that neither axis decides interoperability: what matters is whether an address means the same thing to every reader.">
  <style>
    text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#e7ebf2}
    .lbl{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;fill:#8892a4;letter-spacing:.02em}
    .k{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}
  </style>
  <defs>
    <marker id="arm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8892a4"/></marker>
  </defs>
  <rect x="0" y="0" width="720" height="420" fill="#0d0e11"/>

  <text x="360" y="32" text-anchor="middle" class="lbl" font-size="12" fill="#c5ccd6">WHO WRITES × HOW STRUCTURED</text>

  <!-- column headers -->
  <text x="222" y="66" text-anchor="middle" class="lbl" font-size="11">A PERSON</text>
  <text x="440" y="66" text-anchor="middle" class="lbl" font-size="11">THE AGENT</text>
  <text x="640" y="66" text-anchor="middle" class="lbl" font-size="11" fill="#7c8cf8">AN EXTRACTOR</text>

  <!-- column separators -->
  <line x1="296" y1="54" x2="296" y2="330" stroke="#2a2d38" stroke-dasharray="3 4"/>
  <line x1="584" y1="54" x2="584" y2="330" stroke="#2a2d38" stroke-dasharray="3 4"/>

  <!-- structure axis -->
  <line x1="26" y1="318" x2="26" y2="96" stroke="#8892a4" stroke-width="1.4" marker-end="url(#arm)"/>
  <text x="18" y="210" class="lbl" font-size="10" transform="rotate(-90 18 210)" text-anchor="middle">MORE STRUCTURE</text>

  <!-- row labels + guides -->
  <text x="42" y="304" class="lbl" font-size="10">plain files</text>
  <text x="42" y="244" class="lbl" font-size="10">labeled blocks</text>
  <text x="42" y="184" class="lbl" font-size="10">facts + metadata</text>
  <text x="42" y="118" class="lbl" font-size="10">typed records</text>
  <text x="42" y="131" class="lbl" font-size="10">&amp; graphs</text>
  <line x1="150" y1="270" x2="700" y2="270" stroke="#1d2028"/>
  <line x1="150" y1="210" x2="700" y2="210" stroke="#1d2028"/>
  <line x1="150" y1="150" x2="700" y2="150" stroke="#1d2028"/>

  <!-- person -->
  <rect x="160" y="285" width="124" height="30" rx="8" fill="#1a1d24" stroke="#2a2d38"/>
  <text x="222" y="304" text-anchor="middle" class="k" font-size="9.5">AGENTS.md · CLAUDE.md</text>
  <rect x="160" y="225" width="124" height="30" rx="8" fill="#1a1d24" stroke="#2a2d38"/>
  <text x="222" y="244" text-anchor="middle" font-size="11.5">Cursor rules</text>

  <!-- agent -->
  <rect x="306" y="285" width="128" height="30" rx="8" fill="#1a1d24" stroke="#2a2d38"/>
  <text x="370" y="304" text-anchor="middle" font-size="11.5">memory-tool files</text>
  <rect x="306" y="225" width="128" height="30" rx="8" fill="#1a1d24" stroke="#2a2d38"/>
  <text x="370" y="244" text-anchor="middle" font-size="11.5">Letta blocks</text>
  <rect x="306" y="165" width="128" height="30" rx="8" fill="#1a1d24" stroke="#2a2d38"/>
  <text x="370" y="184" text-anchor="middle" font-size="11.5">Copilot Memory</text>
  <rect x="446" y="165" width="128" height="30" rx="8" fill="#1a1d24" stroke="#2a2d38"/>
  <text x="510" y="184" text-anchor="middle" font-size="11.5">MCP knowledge graph</text>
  <rect x="306" y="105" width="128" height="30" rx="8" fill="#1a1d24" stroke="#2a2d38"/>
  <text x="370" y="124" text-anchor="middle" font-size="11.5">LangGraph store</text>
  <rect x="446" y="105" width="128" height="30" rx="8" fill="#1a1d24" stroke="#2a2d38"/>
  <text x="510" y="124" text-anchor="middle" font-size="11.5">LoreKit record</text>

  <!-- extractor -->
  <rect x="594" y="165" width="100" height="30" rx="8" fill="#1a1d24" stroke="#7c8cf8" stroke-opacity="0.5"/>
  <text x="644" y="184" text-anchor="middle" font-size="11.5">Mem0 facts</text>
  <rect x="594" y="105" width="100" height="30" rx="8" fill="#1a1d24" stroke="#7c8cf8" stroke-opacity="0.5"/>
  <text x="644" y="124" text-anchor="middle" font-size="11.5">Graphiti edges</text>

  <line x1="40" y1="340" x2="700" y2="340" stroke="#2a2d38"/>
  <text x="360" y="366" text-anchor="middle" class="lbl" font-size="11.5" fill="#c5ccd6">Rough placement. Neither axis decides whether two tools can share memory —</text>
  <text x="360" y="386" text-anchor="middle" class="lbl" font-size="11.5" fill="#c5ccd6">that comes down to whether an address means the same thing to every reader.</text>
</svg>
