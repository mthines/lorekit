  <text x="325" y="234" text-anchor="middle" class="lbl" font-size="10.5">cap 2 · MMR λ0.7</text>

  <text x="30" y="30" class="lbl" font-size="12" fill="#34d399">A · SMALL — 6 lessons</text>
  <rect x="30" y="44" width="150" height="120" rx="10" fill="#13151a" stroke="#2a2d38"/>
  <rect x="44" y="58" width="122" height="13" rx="3" fill="#34d399" fill-opacity="0.18" stroke="#34d399" stroke-opacity="0.5"/>
  <rect x="44" y="75" width="122" height="13" rx="3" fill="#34d399" fill-opacity="0.18" stroke="#34d399" stroke-opacity="0.5"/>
