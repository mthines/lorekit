<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-label="The LoreKit learning loop: learns, recalls, promotes, prunes">
<title>The LoreKit learning loop: learns, recalls, promotes, prunes</title>
<rect width="1000" height="400" rx="16" fill="#0d0e11" stroke="#2a2d36"/>
<text x="34" y="44" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#f5a623" text-anchor="start" letter-spacing="2">A MONTH IN THE LIFE OF ONE LESSON</text>
<text x="34" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9aa0ad" text-anchor="start">Illustrative timeline — every step is a mechanic LoreKit ships today.</text>
<rect x="34" y="92" width="214" height="236" rx="12" fill="#2a2010" stroke="#f5a623"/>
<text x="52" y="122" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#9aa0ad" text-anchor="start" letter-spacing="1.5">DAY 1</text>
<text x="230" y="122" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#f5a623" text-anchor="end">4 tries</text>
<text x="52" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f0f2f7" text-anchor="start" letter-spacing="0.5">LEARNS</text>
<text x="52" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9aa0ad" text-anchor="start">Your agent hits a wall and</text>
<text x="52" y="209" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9aa0ad" text-anchor="start">works its way out — then</text>
<text x="52" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9aa0ad" text-anchor="start">writes the lesson itself.</text>
<rect x="48" y="276" width="186" height="34" rx="7" fill="#0d0e11" stroke="#2a2d36"/>
<text x="60" y="298" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#f0f2f7" text-anchor="start">memory.write</text>
<path d="M253 210 h18" stroke="#f5a623" stroke-width="2" fill="none"/>
<path d="M269 205 l7 5 l-7 5" stroke="#f5a623" stroke-width="2" fill="none" stroke-linejoin="round"/>
<rect x="278" y="92" width="214" height="236" rx="12" fill="#13151a" stroke="#2a2d36"/>
<text x="296" y="122" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#9aa0ad" text-anchor="start" letter-spacing="1.5">DAY 4</text>
<text x="474" y="122" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#f5a623" text-anchor="end">1 try</text>
<text x="296" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f0f2f7" text-anchor="start" letter-spacing="0.5">RECALLS</text>
<text x="296" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9aa0ad" text-anchor="start">A teammate’s agent fails the</text>
<text x="296" y="209" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9aa0ad" text-anchor="start">same way. The lesson arrives</text>
<text x="296" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9aa0ad" text-anchor="start">with the error, before a retry.</text>
<rect x="292" y="276" width="186" height="34" rx="7" fill="#0d0e11" stroke="#2a2d36"/>
<text x="304" y="298" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#f0f2f7" text-anchor="start">on the failing call</text>
<path d="M497 210 h18" stroke="#f5a623" stroke-width="2" fill="none"/>
<path d="M513 205 l7 5 l-7 5" stroke="#f5a623" stroke-width="2" fill="none" stroke-linejoin="round"/>
<rect x="522" y="92" width="214" height="236" rx="12" fill="#13151a" stroke="#2a2d36"/>
<text x="540" y="122" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#9aa0ad" text-anchor="start" letter-spacing="1.5">DAY 12</text>
<text x="718" y="122" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#f5a623" text-anchor="end">0 tries</text>
<text x="540" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f0f2f7" text-anchor="start" letter-spacing="0.5">PROMOTES</text>
<text x="540" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9aa0ad" text-anchor="start">Seen three times in three</text>
<text x="540" y="209" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9aa0ad" text-anchor="start">places, it earns a permanent</text>
<text x="540" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9aa0ad" text-anchor="start">rule. Applied before the run.</text>
<rect x="536" y="276" width="186" height="34" rx="7" fill="#0d0e11" stroke="#2a2d36"/>
<text x="548" y="298" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#f0f2f7" text-anchor="start">seen 3× → rule</text>
<path d="M741 210 h18" stroke="#f5a623" stroke-width="2" fill="none"/>
<path d="M757 205 l7 5 l-7 5" stroke="#f5a623" stroke-width="2" fill="none" stroke-linejoin="round"/>
<rect x="766" y="92" width="214" height="236" rx="12" fill="#13151a" stroke="#2a2d36"/>
<text x="784" y="122" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#9aa0ad" text-anchor="start" letter-spacing="1.5">DAY 90</text>
<text x="962" y="122" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#f5a623" text-anchor="end">restorable</text>
<text x="784" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f0f2f7" text-anchor="start" letter-spacing="0.5">PRUNES</text>
<text x="784" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9aa0ad" text-anchor="start">Lore nobody opens stops</text>
<text x="784" y="209" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9aa0ad" text-anchor="start">riding along in every session.</text>
<text x="784" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#9aa0ad" text-anchor="start">Archived, never deleted.</text>
<rect x="780" y="276" width="186" height="34" rx="7" fill="#0d0e11" stroke="#2a2d36"/>
<text x="792" y="298" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#f0f2f7" text-anchor="start">groom --unseen-days 90</text>
<path d="M873 332 V356 q0 10 -10 10 H151 q-10 0 -10 -10 V340" stroke="#5d6370" stroke-width="1.5" stroke-dasharray="5 5" fill="none"/>
<path d="M136 341 l5 -7 l5 7" stroke="#5d6370" stroke-width="1.5" fill="none" stroke-linejoin="round"/>
<rect x="330" y="354" width="340" height="24" fill="#0d0e11"/>
<text x="500" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9aa0ad" text-anchor="middle">and round again — every session, every agent</text>
</svg>
