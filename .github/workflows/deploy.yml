# ─────────────────────────────────────────────────────────────────────────────
# Deploy — preview-first promotion pipeline, runs on merge to main.
#
#   deploy-preview ─▶ smoke-preview ─▶ deploy-production ─▶ smoke-production
#                                              └─▶ rollback-production (on failure)
#   any job fails ─▶ notify-failure (Discord webhook)
#
# "preview" is the pre-production environment (a dedicated Supabase project);
# production is only touched after preview is deployed and smoke-tested.
#
# Tests are NOT re-run here — the merged commit already passed the required PR
# checks in ci.yml (unit + integration). Each job `needs:` the previous one, so a
# red step is a hard gate — nothing downstream runs.
#
# Environments (Settings ▸ Environments) scope the secrets by target. Each needs:
#   preview     → SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD, LOREKIT_SMOKE_TOKEN
#   production  → SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD, LOREKIT_SMOKE_TOKEN
# Repo-level secret shared by both: SUPABASE_ACCESS_TOKEN (personal access token).
# Optional (preview only) — enables the orgs REST smoke suite in smoke-preview
# (see its "Mint a user JWT" step); unset → that suite is announced-skipped and
# the memories suite still runs. The write-heavy REST smoke runs against preview
# only, never production (see the note in smoke-production for why):
#   SUPABASE_ANON_KEY, LOREKIT_SMOKE_EMAIL, LOREKIT_SMOKE_PASSWORD.
# The fixed smoke user those secrets name must already exist on the project — seed it
# once with `node scripts/seed-smoke-user.mjs` (see docs/deployment.md → "Seed
# the orgs-smoke user"); the mint signs in as it, it is never auto-created.
# Optional repo-level secret: DISCORD_WEBHOOK_URL — when set, notify-failure posts
# a message there on any deploy-pipeline failure. Unset → notify-failure no-ops.
# Add a required reviewer on the `production` environment for a manual gate.
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Never cancel an in-flight deploy — a half-applied migration is worse than a queue.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. Deploy to PREVIEW (migrations, then functions) ─────────────────────────
  #    No test job here: the commit on main already passed the required PR checks
  #    in ci.yml (unit + integration). Re-running them would just duplicate that
  #    work. Protect main with those required checks so only verified commits ever
  #    reach this pipeline.
  deploy-preview:
    name: Deploy → preview
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Verify preview environment secrets are set
        run: |
          missing=""
          [ -z "$PROJECT_REF" ] && missing="$missing SUPABASE_PROJECT_REF"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets for the 'preview' environment:$missing. Add them under Settings ▸ Environments ▸ preview."
            exit 1
          fi

      - name: Tag deploy in Dash0 (VCS resource attributes)
        run: |
          supabase secrets set \
            VCS_REPOSITORY_URL_FULL="https://github.com/${{ github.repository }}" \
            VCS_REF_HEAD_NAME="${{ github.ref_name }}" \
            VCS_REF_HEAD_REVISION="${{ github.sha }}" \
            VCS_REPOSITORY_NAME="${{ github.repository }}" \
            --project-ref "$PROJECT_REF"

      - name: Link the Supabase project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Push database migrations
        # --include-all applies a migration even when a LOWER-numbered file was
        # merged after a higher-numbered one already reached this remote — which
        # happens when parallel PRs pick colliding sequential prefixes (e.g.
        # #260 shipped 00042, then #266 shipped 00041). Without it `db push`
        # aborts with "migration files to be inserted before the last migration
        # on remote". Migrations are still applied in on-disk numeric order; the
        # PR-time guard (scripts/check-migration-order.mjs, the `migration-order`
        # CI job) is what stops an out-of-order file from landing in the first
        # place, so this flag only ever applies already-reviewed, CI-tested ones.
        run: supabase db push --include-all

      - name: Deploy edge functions (mcp + health)
        # Retry up to 3 times with 10 s back-off to tolerate transient OOM
        # crashes (exit 135 / SIGBUS) from the edge-runtime bundler container.
        run: |
          for attempt in 1 2 3; do
            supabase functions deploy --no-verify-jwt --project-ref "$PROJECT_REF" && break
            rc=$?
            if [ $attempt -eq 3 ]; then
              echo "::error::Edge function deploy failed after $attempt attempts (exit $rc)"
              exit $rc
            fi
            echo "::warning::Edge function deploy failed (exit $rc), retrying in 10 s (attempt $attempt/3)..."
            sleep 10
          done

  # ── 2. Integration test against PREVIEW (the gate before prod) ────────────────
  smoke-preview:
    name: Smoke tests → preview
    runs-on: ubuntu-latest
    needs: deploy-preview
    environment: preview
    permissions:
      contents: read
    env:
      # Gate for the optional orgs REST smoke suite. The org endpoints require a
      # Supabase USER JWT (lk_* tokens and the service-role key are rejected), so
      # it runs only when a fixed smoke user is configured. Mapped from secrets
      # here so a step `if:` can read it — a step `if:` cannot reference secrets
      # via env of the same step. Unset → the suite self-skips (announced).
      HAVE_ORG_SMOKE_CREDS: ${{ secrets.LOREKIT_SMOKE_EMAIL != '' && secrets.LOREKIT_SMOKE_PASSWORD != '' && secrets.SUPABASE_ANON_KEY != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration test against preview endpoint
        run: pnpm nx test mcp-server -- smoke.integration
        env:
          LOREKIT_SMOKE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/mcp
          LOREKIT_SMOKE_TOKEN: ${{ secrets.LOREKIT_SMOKE_TOKEN }}

      # BYOD (bring-your-own-database) round-trip against a self-hosted Supabase
      # project running the same edge function in BYOD mode. Opt-in coverage:
      #   • unset LOREKIT_BYOD_URL / LOREKIT_BYOD_TOKEN → the test self-skips.
      #   • byod-smoke.integration.spec.ts not present yet → --passWithNoTests keeps
      #     the step green (the spec lands with its own PR; this decouples merge
      #     order so a mis-ordered merge can't red the deploy/rollback pipeline).
      # Only a real BYOD assertion failure fails the step.
      - name: Run BYOD integration test (all four scope types)
        run: pnpm nx test mcp-server -- byod-smoke.integration --passWithNoTests
        env:
          LOREKIT_BYOD_URL: ${{ secrets.LOREKIT_BYOD_URL }}
          LOREKIT_BYOD_TOKEN: ${{ secrets.LOREKIT_BYOD_TOKEN }}

      # Reproduce the real onboarding flow end-to-end against the live preview
      # deploy: scaffold the skill + .mcp.json, then `doctor --deep` (skill found,
      # token, endpoint, connectivity, and a self-cleaning write→read→delete
      # round-trip). This is the holistic health gate — the single command that
      # catches a placeholder endpoint, a bad token, an unreachable host, or a
      # broken round-trip in one shot. The zero-dep CLI runs straight from source.
      - name: Onboarding smoke — install, then doctor --deep (live round-trip)
        run: |
          node packages/cli/bin/lorekit.mjs install --project --no-hooks --yes \
            --endpoint "$URL" --token "$TOKEN"
          node packages/cli/bin/lorekit.mjs doctor --deep --endpoint "$URL" --token "$TOKEN"
        env:
          URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/mcp
          TOKEN: ${{ secrets.LOREKIT_SMOKE_TOKEN }}

      # The two script-based smokes ci.yml's integration job runs (against a
      # local Supabase), now replayed against the live preview deploy so the
      # merge gate and the deploy gate assert the same transport + REST contracts.

      # Robust local stdio transport (`lorekit mcp`): spawns the CLI's stdio
      # server in remote-passthrough mode and drives initialize → tools/list →
      # memory.list against the endpoint — proving the transport a `.mcp.json`
      # points at launches and reaches the backend. Same script as ci.yml.
      - name: Smoke — robust stdio transport handshakes against preview
        run: node scripts/smoke-mcp-stdio.mjs "$URL" "$TOKEN"
        env:
          URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/mcp
          TOKEN: ${{ secrets.LOREKIT_SMOKE_TOKEN }}

      # Mint a user JWT so smoke-rest can include the orgs suite. Fixed-user mode
      # (LOREKIT_SMOKE_EMAIL/PASSWORD) — never provisions users in a real tenant,
      # unlike CI's ephemeral mode against a throwaway local stack. Runs only when
      # the optional credentials are configured; otherwise the orgs suite is left
      # out and announced by smoke-rest, never a green suite that tested nothing.
      #
      # BEST-EFFORT: the orgs suite is opt-in, so a mint failure must NOT fail the
      # deploy. mint-smoke-jwt.mjs exits non-zero when the fixed smoke user can't
      # sign in (unseeded/unconfirmed user, wrong password, or email+password
      # sign-in disabled on the project) — do not let that red the pipeline and
      # block promotion to production. On failure we warn loudly and leave the
      # `jwt` output empty, so smoke-rest runs the memories suite only and
      # announces the orgs skip. To ENABLE the orgs suite, seed a confirmed
      # email+password user on this project matching LOREKIT_SMOKE_EMAIL/PASSWORD.
      # (`if <cmd>` suspends `set -e` for the mint, so a failure lands in `else`.)
      - name: Mint a user JWT for the orgs REST smoke (optional)
        id: smokejwt
        if: env.HAVE_ORG_SMOKE_CREDS == 'true'
        env:
          LOREKIT_REST_BASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          LOREKIT_SMOKE_EMAIL: ${{ secrets.LOREKIT_SMOKE_EMAIL }}
          LOREKIT_SMOKE_PASSWORD: ${{ secrets.LOREKIT_SMOKE_PASSWORD }}
        run: |
          if JWT="$(node scripts/mint-smoke-jwt.mjs)"; then
            echo "::add-mask::$JWT"
            echo "jwt=$JWT" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not mint a smoke JWT — the orgs REST suite is skipped this run. Seed a confirmed email+password smoke user (matching LOREKIT_SMOKE_EMAIL/PASSWORD) on this project to enable it."
          fi

      # REST Edge Functions end-to-end against the live preview stack — the
      # `memories` suite always (gated by LOREKIT_SMOKE_TOKEN), the `orgs` suite
      # only when the JWT above was minted. Same script as ci.yml; the specs
      # self-clean with timestamped keys, so this is safe against a live project.
      - name: Smoke — REST API (memories + orgs) against preview
        env:
          LOREKIT_REST_BASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1
          LOREKIT_SMOKE_TOKEN: ${{ secrets.LOREKIT_SMOKE_TOKEN }}
          LOREKIT_SMOKE_JWT: ${{ steps.smokejwt.outputs.jwt }}
        run: node scripts/smoke-rest.mjs

  # ── 3. Deploy to PRODUCTION (only reached if preview is green) ────────────────
  deploy-production:
    name: Deploy → production
    runs-on: ubuntu-latest
    needs: smoke-preview
    environment: production
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Verify production environment secrets are set
        run: |
          missing=""
          [ -z "$PROJECT_REF" ] && missing="$missing SUPABASE_PROJECT_REF"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets for the 'production' environment:$missing. Add them under Settings ▸ Environments ▸ production."
            exit 1
          fi

      - name: Tag deploy in Dash0 (VCS resource attributes)
        run: |
          supabase secrets set \
            VCS_REPOSITORY_URL_FULL="https://github.com/${{ github.repository }}" \
            VCS_REF_HEAD_NAME="${{ github.ref_name }}" \
            VCS_REF_HEAD_REVISION="${{ github.sha }}" \
            VCS_REPOSITORY_NAME="${{ github.repository }}" \
            --project-ref "$PROJECT_REF"

      - name: Link the Supabase project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Push database migrations
        # --include-all applies a migration even when a LOWER-numbered file was
        # merged after a higher-numbered one already reached this remote — which
        # happens when parallel PRs pick colliding sequential prefixes (e.g.
        # #260 shipped 00042, then #266 shipped 00041). Without it `db push`
        # aborts with "migration files to be inserted before the last migration
        # on remote". Migrations are still applied in on-disk numeric order; the
        # PR-time guard (scripts/check-migration-order.mjs, the `migration-order`
        # CI job) is what stops an out-of-order file from landing in the first
        # place, so this flag only ever applies already-reviewed, CI-tested ones.
        run: supabase db push --include-all

      - name: Deploy edge functions (mcp + health)
        # Retry up to 3 times with 10 s back-off to tolerate transient OOM
        # crashes (exit 135 / SIGBUS) from the edge-runtime bundler container.
        run: |
          for attempt in 1 2 3; do
            supabase functions deploy --no-verify-jwt --project-ref "$PROJECT_REF" && break
            rc=$?
            if [ $attempt -eq 3 ]; then
              echo "::error::Edge function deploy failed after $attempt attempts (exit $rc)"
              exit $rc
            fi
            echo "::warning::Edge function deploy failed (exit $rc), retrying in 10 s (attempt $attempt/3)..."
            sleep 10
          done

  # ── 4. Post-deploy verification against PRODUCTION ───────────────────────────
  smoke-production:
    name: Smoke test → production
    runs-on: ubuntu-latest
    needs: deploy-production
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify health endpoint
        run: |
          URL="https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/health"
          STATUS=$(curl -sf "$URL" | jq -r '.status // "unknown"')
          echo "### Production deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health endpoint status: **${STATUS}**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATUS" != "ok" ]; then
            echo "::error::Production health check returned '${STATUS}'"
            exit 1
          fi

      - name: Verify MCP endpoint responds (tools/list)
        run: |
          URL="https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/mcp"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL" \
            -H "Authorization: Bearer ${{ secrets.LOREKIT_SMOKE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
          echo "- MCP tools/list HTTP: **${CODE}**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CODE" != "200" ]; then
            echo "::error::Production MCP endpoint returned HTTP ${CODE} for tools/list"
            exit 1
          fi

      # Full authenticated onboarding + round-trip against the live production
      # deploy, mirroring smoke-preview: scaffold skill + config, then
      # `doctor --deep` (self-cleaning write→read→delete). Stronger than the
      # curl checks above — it proves the production write path, not just reachability.
      - name: Onboarding smoke — install, then doctor --deep (live round-trip)
        run: |
          node packages/cli/bin/lorekit.mjs install --project --no-hooks --yes \
            --endpoint "$URL" --token "$TOKEN"
          node packages/cli/bin/lorekit.mjs doctor --deep --endpoint "$URL" --token "$TOKEN"
        env:
          URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/mcp
          TOKEN: ${{ secrets.LOREKIT_SMOKE_TOKEN }}

      # BYOD (bring-your-own-database) round-trip against a self-hosted Supabase
      # project running the same edge function in BYOD mode. Opt-in coverage:
      #   • unset LOREKIT_BYOD_URL / LOREKIT_BYOD_TOKEN → the test self-skips.
      #   • byod-smoke.integration.spec.ts not present yet → --passWithNoTests keeps
      #     the step green (the spec lands with its own PR; this decouples merge
      #     order so a mis-ordered merge can't red the deploy/rollback pipeline).
      # Only a real BYOD assertion failure fails the step.
      - name: Run BYOD integration test (all four scope types)
        run: pnpm nx test mcp-server -- byod-smoke.integration --passWithNoTests
        env:
          LOREKIT_BYOD_URL: ${{ secrets.LOREKIT_BYOD_URL }}
          LOREKIT_BYOD_TOKEN: ${{ secrets.LOREKIT_BYOD_TOKEN }}

      # Robust local stdio transport (`lorekit mcp`): initialize → tools/list →
      # memory.list against the production endpoint — the same script ci.yml runs
      # (against a local Supabase). This one is READ-ONLY (`memory.list`), so it
      # adds no synthetic rows to the production tables and its flake profile
      # matches the tools/list curl above; both gate rollback, which is fine.
      - name: Smoke — robust stdio transport handshakes against production
        run: node scripts/smoke-mcp-stdio.mjs "$URL" "$TOKEN"
        env:
          URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/mcp
          TOKEN: ${{ secrets.LOREKIT_SMOKE_TOKEN }}

      # NOTE: the write-heavy REST smoke (scripts/smoke-rest.mjs) is deliberately
      # NOT run here — it runs in smoke-preview only. Do NOT "restore parity" by
      # re-adding it to production:
      #   • It writes append-only rows (audit_log / usage_events) that no cleanup
      #     can remove, so every prod deploy would leave synthetic audit trail in
      #     the live tenant (the orgs sub-suite adds org.create/member.* on top).
      #   • A flaky live vitest run would then trip rollback-production, auto-
      #     redeploying the previous commit's functions on a test hiccup.
      #   • It is redundant here: smoke-preview already exercised the full REST
      #     contract against the IDENTICAL promoted function bundle on the staging
      #     project before this job runs, and the self-cleaning `doctor --deep`
      #     round-trip above already verifies the production write path.

  # ── 5. Rollback PRODUCTION functions on a production failure ──────────────────
  #    Redeploys the previous commit's edge functions. Migrations are forward-only
  #    (expand/contract + PITR is the DB safety net) so they are intentionally not
  #    reverted here. Gated strictly on a PRODUCTION-job failure: a failure earlier
  #    in the pipeline (preview) skips deploy-production, so neither prod job
  #    reports 'failure' and this rollback does NOT run — prod is never touched
  #    unless a prod deploy was actually attempted.
  rollback-production:
    name: Rollback → production functions
    runs-on: ubuntu-latest
    needs: [deploy-production, smoke-production]
    if: always() && (needs.deploy-production.result == 'failure' || needs.smoke-production.result == 'failure')
    environment: production
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout repository (with previous commit)
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Restore previous commit's function code
        run: git checkout HEAD~1 -- supabase/functions supabase/config.toml

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Redeploy previous edge functions
        run: supabase functions deploy --no-verify-jwt --project-ref "$PROJECT_REF"

      - name: Report rollback
        run: |
          echo "### ⚠️ Production rollback executed" >> "$GITHUB_STEP_SUMMARY"
          echo "Edge functions were rolled back to \`$(git rev-parse HEAD~1)\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Database migrations were **not** reverted (forward-only)." >> "$GITHUB_STEP_SUMMARY"
          echo "Inspect the failing job above and, if a migration is at fault, restore via PITR." >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Production deploy failed — functions rolled back to the previous commit."
          exit 1

  # ── 6. Notify Discord on ANY deploy-pipeline failure ─────────────────────────
  #    Fires when any job above reports 'failure' — a deploy step, a smoke gate, or
  #    the rollback. Posts a single embed to the DISCORD_WEBHOOK_URL webhook so a
  #    red production deploy reaches you outside the Actions UI (the failure the
  #    smoke tests would otherwise report only there). If the webhook secret is
  #    unset the job no-ops with a warning and never fails the run itself — the
  #    real failure is already reported loudly by the job that broke.
  #    The posting logic itself lives in the shared ./.github/actions/discord-notify
  #    composite action (also used by release.yml); this job only decides WHICH
  #    stage failed and passes it in. The stage name is derived via `env:` (never
  #    interpolated into the shell) to avoid workflow script injection.
  notify-failure:
    name: Notify on failure (Discord + Dash0)
    runs-on: ubuntu-latest
    needs: [deploy-preview, smoke-preview, deploy-production, smoke-production, rollback-production]
    if: always() && contains(needs.*.result, 'failure')
    permissions:
      contents: read # checkout, so the local composite action is available
    steps:
      - name: Checkout repository (for the composite action)
        uses: actions/checkout@v7

      - name: Identify the failed stage
        id: stage
        env:
          RESULT_DEPLOY_PREVIEW: ${{ needs.deploy-preview.result }}
          RESULT_SMOKE_PREVIEW: ${{ needs.smoke-preview.result }}
          RESULT_DEPLOY_PRODUCTION: ${{ needs.deploy-production.result }}
          RESULT_SMOKE_PRODUCTION: ${{ needs.smoke-production.result }}
          RESULT_ROLLBACK: ${{ needs.rollback-production.result }}
        run: |
          # Name the first pipeline stage that failed (top-to-bottom = root cause;
          # rollback failing is a symptom of a prod-job failure listed before it).
          failed="an unknown stage"
          if   [ "$RESULT_DEPLOY_PREVIEW"    = "failure" ]; then failed="deploy → preview"
          elif [ "$RESULT_SMOKE_PREVIEW"     = "failure" ]; then failed="smoke tests → preview"
          elif [ "$RESULT_DEPLOY_PRODUCTION" = "failure" ]; then failed="deploy → production"
          elif [ "$RESULT_SMOKE_PRODUCTION"  = "failure" ]; then failed="smoke test → production"
          elif [ "$RESULT_ROLLBACK"          = "failure" ]; then failed="production (rolled back to previous commit)"
          fi
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Post failure notification to Discord
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          username: LoreKit Deploy
          title: '🔴 Production deploy failed'
          failed-stage: ${{ steps.stage.outputs.failed }}

      - name: Post failure event to Dash0
        uses: ./.github/actions/dash0-notify
        with:
          webhook-url: ${{ secrets.DASH0_WEBHOOK_URL }}
          failed-stage: ${{ steps.stage.outputs.failed }}
