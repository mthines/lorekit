# ─────────────────────────────────────────────────────────────────────────────
# Deploy — preview-first promotion pipeline, runs on merge to main.
#
# Both the API (Supabase edge functions + migrations) AND the web dashboard
# (Next.js on Vercel) are deployed here, in lockstep, so the frontend and backend
# flip to production together instead of skewing apart. Vercel's native Git
# auto-deploy is disabled (packages/web/vercel.json → git.deploymentEnabled.main
# = false); this workflow is now the ONLY path the dashboard reaches production.
#
#   deploy-preview (API) ────────┐
#   deploy-web-preview (FE) ──────┤
#   stage-web-production (FE build)┘
#            └─▶ smoke-preview ─▶ deploy-production (API) ─▶ promote-web-production (FE)
#                                          └────────────────────────┴─▶ smoke-production
#                                                                            ├─▶ rollback-production (functions)
#                                                                            └─▶ rollback-web-production (Vercel)
#   any job fails ─▶ notify-failure (Discord + Dash0)
#
# "preview" is the pre-production environment (a dedicated Supabase project);
# production is only touched after preview is deployed and smoke-tested. The web
# production build is PRE-BUILT and uploaded during the preview phase
# (stage-web-production, `--skip-domain`) so the final flip (promote-web-production)
# is a near-instant alias swap that runs right after the API's deploy-production —
# the production DOMAIN is never assigned until preview is green and the production
# environment gate is cleared.
#
# Tests are NOT re-run here — the merged commit already passed the required PR
# checks in ci.yml (unit + integration). Each job `needs:` the previous one, so a
# red step is a hard gate — nothing downstream runs.
#
# Environments (Settings ▸ Environments) scope the secrets by target. Each needs:
#   preview     → SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD, LOREKIT_SMOKE_TOKEN
#   production  → SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD, LOREKIT_SMOKE_TOKEN
# Repo-level secret shared by both: SUPABASE_ACCESS_TOKEN (personal access token).
# Repo-level Vercel secrets (used by every web job): VERCEL_TOKEN, VERCEL_ORG_ID,
# VERCEL_PROJECT_ID — the same three preview.yml already uses.
# Optional repo-level variable: WEB_PROD_URL (the production dashboard origin the
# production smoke curls; defaults to https://lorekit.io).
# Optional (preview only) — enables the orgs REST smoke suite in smoke-preview
# (see its "Mint a user JWT" step); unset → that suite is announced-skipped and
# the memories suite still runs. SUPABASE_ANON_KEY additionally points the
# preview web build at the preview Supabase project (deploy-web-preview). The
# write-heavy REST smoke runs against preview only, never production (see the
# note in smoke-production for why):
#   SUPABASE_ANON_KEY, LOREKIT_SMOKE_EMAIL, LOREKIT_SMOKE_PASSWORD.
# The fixed smoke user those secrets name must already exist on the project — seed it
# once with `node scripts/seed-smoke-user.mjs` (see docs/deployment.md → "Seed
# the orgs-smoke user"); the mint signs in as it, it is never auto-created.
# Optional repo-level secret: DISCORD_WEBHOOK_URL — when set, notify-failure posts
# a message there on any deploy-pipeline failure. Unset → notify-failure no-ops.
# Add a required reviewer on the `production` environment for a manual gate.
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'What to deploy (overrides the change-detection step for a manual run)'
        type: choice
        default: auto
        options:
          - auto        # Use the change-detection step (same as a push to main)
          - all         # Force BOTH halves — API + web
          - api         # API only (Supabase edge functions + migrations)
          - web         # Web only (Next.js dashboard on Vercel)

permissions: {}

# Never cancel an in-flight deploy — a half-applied migration is worse than a queue.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 0. Detect what changed — gate the API and web halves independently ────────
  #    A merge that touches only the web (or only the API, or only docs) should not
  #    redeploy the unchanged half. Same path-filter approach as ci.yml's `changes`
  #    job. `packages/schemas/` maps to BOTH (the edge functions mirror it and the
  #    web transpiles it); the workspace files and deploy.yml itself force BOTH, so
  #    a change to this pipeline exercises the whole thing. Skipping the unchanged
  #    half is safe for the FE↔API lockstep — lockstep only matters when both
  #    change, and then both halves run and flip together.
  #
  #    A MANUAL run (workflow_dispatch) can override the detection with the
  #    `deploy_target` input: `all` forces both halves, `api`/`web` force exactly
  #    one, and `auto` (the default) falls back to the path filter — so a maintainer
  #    can redeploy an unchanged half from the Actions UI without a no-op commit.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Compare changed paths against the deploy globs
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          DEPLOY_TARGET: ${{ inputs.deploy_target }}
        run: |
          # Manual override: a workflow_dispatch run can force what deploys,
          # bypassing the path filter entirely. `auto` (and any push, where the
          # input is empty) falls through to the change detection below.
          case "$DEPLOY_TARGET" in
            all) API=true;  WEB=true  ;;
            api) API=true;  WEB=false ;;
            web) API=false; WEB=true  ;;
            *)   API=skip;  WEB=skip  ;;  # auto / empty → detect below
          esac
          if [ "$API" != skip ]; then
            echo "Manual deploy target '$DEPLOY_TARGET' → api=$API web=$WEB"
            echo "api=$API" >> "$GITHUB_OUTPUT"
            echo "web=$WEB" >> "$GITHUB_OUTPUT"
            echo "### Deploy scope (manual override: \`$DEPLOY_TARGET\`)" >> "$GITHUB_STEP_SUMMARY"
            echo "- API (Supabase): $API" >> "$GITHUB_STEP_SUMMARY"
            echo "- Web (Vercel): $WEB" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BASE="$BEFORE"
          # Fall back to the parent commit for a first push, a missing base SHA,
          # or workflow_dispatch (no event.before) → compare against HEAD~1.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "Comparing ${BASE}...HEAD"
          CHANGED="$(git diff --name-only "${BASE}" HEAD)"
          echo "$CHANGED"
          API=false; WEB=false
          # API = Supabase edge functions + migrations + the packages that compile
          # into them (schemas mirror into the functions). Workspace files + this
          # workflow force a deploy.
          if printf '%s\n' "$CHANGED" | grep -qE '^(packages/mcp-core/|packages/mcp-server/|packages/schemas/|supabase/functions/|supabase/migrations/|supabase/tests/|supabase/config\.toml|package\.json|pnpm-lock\.yaml|nx\.json|\.github/workflows/deploy\.yml)'; then
            API=true
          fi
          # Web = the Next.js dashboard + the schemas it transpiles + the workspace
          # files that change how it installs, plus this workflow.
          if printf '%s\n' "$CHANGED" | grep -qE '^(packages/web/|packages/schemas/|package\.json|pnpm-lock\.yaml|nx\.json|\.github/workflows/deploy\.yml)'; then
            WEB=true
          fi
          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "web=$WEB" >> "$GITHUB_OUTPUT"
          echo "### Deploy scope" >> "$GITHUB_STEP_SUMMARY"
          echo "- API (Supabase): $API" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web (Vercel): $WEB" >> "$GITHUB_STEP_SUMMARY"

  # ── 1. Deploy to PREVIEW (migrations, then functions) ─────────────────────────
  #    No test job here: the commit on main already passed the required PR checks
  #    in ci.yml (unit + integration). Re-running them would just duplicate that
  #    work. Protect main with those required checks so only verified commits ever
  #    reach this pipeline. Gated on `changes.api` — a web-only or docs-only merge
  #    skips the whole API preview→smoke→prod cycle.
  deploy-preview:
    name: Deploy → preview
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true'
    environment: preview
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Verify preview environment secrets are set
        run: |
          missing=""
          [ -z "$PROJECT_REF" ] && missing="$missing SUPABASE_PROJECT_REF"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets for the 'preview' environment:$missing. Add them under Settings ▸ Environments ▸ preview."
            exit 1
          fi

      - name: Tag deploy in Dash0 (VCS resource attributes)
        run: |
          supabase secrets set \
            VCS_REPOSITORY_URL_FULL="https://github.com/${{ github.repository }}" \
            VCS_REF_HEAD_NAME="${{ github.ref_name }}" \
            VCS_REF_HEAD_REVISION="${{ github.sha }}" \
            VCS_REPOSITORY_NAME="${{ github.repository }}" \
            --project-ref "$PROJECT_REF"

      - name: Link the Supabase project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Set up Node.js (for the migration-drift classifier)
        uses: actions/setup-node@v7
        with:
          node-version: 20

      # `preview` is a SHARED Supabase project, and preview.yml ALSO pushes
      # migrations to it — from an OPEN PR's head SHA, on a `/preview` comment.
      # So its migration history can legitimately carry versions that do not
      # exist on this ref yet, and `supabase db push` treats a remote that is
      # merely AHEAD as fatal even when this ref has nothing left to apply.
      # Classify the drift first and react proportionally; this step never
      # repairs or mutates the remote's migration history.
      - name: Classify migration drift against preview
        id: drift
        run: |
          # Tolerate a non-zero exit here: the classifier decides, not the CLI.
          # A listing it cannot parse yields `push` — the previous behaviour,
          # error message included.
          supabase migration list --linked > /tmp/migration-list.txt 2>&1 || true
          cat /tmp/migration-list.txt
          node scripts/check-remote-migration-drift.mjs < /tmp/migration-list.txt

      - name: Push database migrations
        if: steps.drift.outputs.action == 'push'
        # --include-all applies a migration even when a LOWER-numbered file was
        # merged after a higher-numbered one already reached this remote — which
        # happens when parallel PRs pick colliding sequential prefixes (e.g.
        # #260 shipped 00042, then #266 shipped 00041). Without it `db push`
        # aborts with "migration files to be inserted before the last migration
        # on remote". Migrations are still applied in on-disk numeric order; the
        # PR-time guard (scripts/check-migration-order.mjs, the `migration-order`
        # CI job) is what stops an out-of-order file from landing in the first
        # place, so this flag only ever applies already-reviewed, CI-tested ones.
        run: supabase db push --include-all

      - name: Deploy edge functions (mcp + health)
        # Retry up to 3 times with 10 s back-off to tolerate transient OOM
        # crashes (exit 135 / SIGBUS) from the edge-runtime bundler container.
        run: |
          for attempt in 1 2 3; do
            supabase functions deploy --no-verify-jwt --project-ref "$PROJECT_REF" && break
            rc=$?
            if [ $attempt -eq 3 ]; then
              echo "::error::Edge function deploy failed after $attempt attempts (exit $rc)"
              exit $rc
            fi
            echo "::warning::Edge function deploy failed (exit $rc), retrying in 10 s (attempt $attempt/3)..."
            sleep 10
          done

  # ── 1b. Deploy WEB to PREVIEW (Vercel) ────────────────────────────────────────
  #    Builds the dashboard against the PREVIEW Supabase project and deploys a
  #    Vercel preview, so the FE that smoke-preview exercises is the same bundle
  #    the API preview just shipped. Runs in parallel with deploy-preview — a
  #    Vercel build does not need the freshly-deployed functions to compile.
  deploy-web-preview:
    name: Deploy web → preview (Vercel)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    environment: preview
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Verify Vercel secrets are set
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo-level Vercel secrets:$missing. Add them under Settings ▸ Secrets and variables ▸ Actions."
            exit 1
          fi

      - name: Install Vercel CLI
        run: pnpm add -g vercel@58

      - name: Pull Vercel environment (preview)
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      # Point the preview FE at the PREVIEW Supabase project so smoke exercises the
      # same API bundle deploy-preview just shipped. Mirrors preview.yml: rewrite
      # the env file `vercel build` actually reads (.vercel/.env.preview.local), the
      # only file whose values win over a .env.local entry. Skipped when
      # SUPABASE_ANON_KEY is unset — the pulled Vercel preview env values remain
      # (which may target production); set it in the preview environment to
      # guarantee the FE talks to the preview API.
      - name: Override Supabase config with preview-project values
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          ENV_FILE=".vercel/.env.preview.local"
          if [ -z "$ANON_KEY" ]; then
            echo "::warning::SUPABASE_ANON_KEY unset for the preview environment — the preview web build uses Vercel's pulled Supabase env, which may point at production. Set it to pin the FE at the preview API."
            exit 0
          fi
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::$ENV_FILE not found — did 'vercel pull' run?"
            exit 1
          fi
          grep -vE '^(NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_ANON_KEY|NEXT_PUBLIC_SUPABASE_PROJECT_REF)=' \
            "$ENV_FILE" > "$ENV_FILE.tmp" || true
          mv "$ENV_FILE.tmp" "$ENV_FILE"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=https://${PROJECT_REF}.supabase.co"
            echo "NEXT_PUBLIC_SUPABASE_PROJECT_REF=${PROJECT_REF}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
          } >> "$ENV_FILE"

      # A CLI build gets none of Vercel's auto-injected VERCEL_GIT_* system env
      # vars, so set them by hand — instrumentation-client.ts bakes them into
      # NEXT_PUBLIC_VCS_* (OTel VCS resource attributes) and service.version.
      - name: Build (preview)
        env:
          VERCEL_GIT_REPO_OWNER: ${{ github.repository_owner }}
          VERCEL_GIT_REPO_SLUG: ${{ github.event.repository.name }}
          VERCEL_GIT_COMMIT_REF: ${{ github.ref_name }}
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel (preview)
        id: deploy
        run: |
          # Vercel prints the deployment URL to stdout and progress to stderr;
          # grep the URL so a trailing stderr line is never mistaken for it.
          out="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "$out"
          URL="$(printf '%s\n' "$out" | grep -Eo 'https://[^[:space:]]+' | tail -1)"
          if [ -z "$URL" ]; then
            echo "::error::Could not parse Vercel preview deployment URL"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Verify preview deployment responds
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -L "$URL")
          echo "### Web preview" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $URL (HTTP $CODE)" >> "$GITHUB_STEP_SUMMARY"
          # Vercel deployment protection can return 401 for a raw preview URL;
          # accept any non-5xx as "the build served".
          if [ "$CODE" -ge 500 ]; then
            echo "::error::Web preview returned HTTP $CODE"
            exit 1
          fi

  # ── 1c. STAGE web production build (Vercel, pre-built, no domain) ──────────────
  #    Builds the production dashboard bundle (against Vercel's PRODUCTION env, so
  #    it targets the production Supabase project) and uploads it as a
  #    production-target deployment WITHOUT applying the production domain
  #    (--skip-domain). Doing the slow `next build` here, during the preview phase,
  #    makes the later flip (promote-web-production) a near-instant alias swap that
  #    lands together with the API's deploy-production. No `environment:` — this
  #    only STAGES (nothing serves on the domain yet), so it must not sit behind the
  #    production approval gate; it authenticates to Vercel with the repo token.
  stage-web-production:
    name: Stage web → production (Vercel, pre-built)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true'
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    outputs:
      deployment_url: ${{ steps.stage.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Verify Vercel secrets are set
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo-level Vercel secrets:$missing. Add them under Settings ▸ Secrets and variables ▸ Actions."
            exit 1
          fi

      - name: Install Vercel CLI
        run: pnpm add -g vercel@58

      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build (production)
        env:
          VERCEL_GIT_REPO_OWNER: ${{ github.repository_owner }}
          VERCEL_GIT_REPO_SLUG: ${{ github.event.repository.name }}
          VERCEL_GIT_COMMIT_REF: ${{ github.ref_name }}
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Upload prebuilt production output (staged, no domain)
        id: stage
        run: |
          # Create a PRODUCTION-target deployment but do NOT assign the production
          # domain yet (--skip-domain). Uploads + builds here, in the preview phase;
          # the domain is applied only by promote-web-production, which is gated
          # behind deploy-production (API) + the production environment approval —
          # so the production domain is never touched until preview is green.
          out="$(vercel deploy --prebuilt --prod --skip-domain --token="$VERCEL_TOKEN")"
          echo "$out"
          URL="$(printf '%s\n' "$out" | grep -Eo 'https://[^[:space:]]+' | tail -1)"
          if [ -z "$URL" ]; then
            echo "::error::Could not parse staged Vercel production deployment URL"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Web production (staged)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Built and uploaded: $URL (domain not yet applied)" >> "$GITHUB_STEP_SUMMARY"

  # ── 2. Integration test against PREVIEW (the gate before prod) ────────────────
  smoke-preview:
    name: Smoke tests → preview
    runs-on: ubuntu-latest
    needs: [deploy-preview, deploy-web-preview]
    # Runs when the API was deployed to preview (it smoke-tests the API). A skipped
    # web job (web unchanged) is fine; a FAILED web-preview build halts the whole
    # prod deploy — don't half-ship a merge that changed both.
    if: always() && needs.deploy-preview.result == 'success' && needs.deploy-web-preview.result != 'failure'
    environment: preview
    permissions:
      contents: read
    env:
      # Gate for the optional orgs REST smoke suite. The org endpoints require a
      # Supabase USER JWT (lk_* tokens and the service-role key are rejected), so
      # it runs only when a fixed smoke user is configured. Mapped from secrets
      # here so a step `if:` can read it — a step `if:` cannot reference secrets
      # via env of the same step. Unset → the suite self-skips (announced).
      HAVE_ORG_SMOKE_CREDS: ${{ secrets.LOREKIT_SMOKE_EMAIL != '' && secrets.LOREKIT_SMOKE_PASSWORD != '' && secrets.SUPABASE_ANON_KEY != '' }}
      # ── Smoke telemetry (job-wide, inherited by every step) ───────────────────
      # Make the smoke run OBSERVABLE in Dash0 so a failure is diagnosable from
      # the telemetry, not just the CI log. Three knobs, all read by the code
      # the smokes already run:
      #   • LOREKIT_TELEMETRY_TOKEN — turns ON CLI OTLP export (off by default in
      #     a source checkout: the baked-in token is injected only at npm publish),
      #     so `install` / `doctor --deep` emit their `cli` spans + metrics.
      #   • DEPLOYMENT_ENVIRONMENT=test — stamps `deployment.environment.name=test`
      #     on the CLI's own spans AND, via the `X-LoreKit-Deployment-Environment`
      #     header the CLI/`restFetch` + the REST/MCP smoke specs forward, on the
      #     edge (`api`) spans for every smoke request — so ALL synthetic smoke
      #     telemetry (cli + api + mcp) filters apart from real traffic. The edge
      #     honours only `test` (supabase/functions/_shared/otel.ts).
      #   • LOREKIT_CORRELATION_ID — a per-run key on every REST call's
      #     `usage_events.correlation_id`, so one run's calls are greppable.
      LOREKIT_TELEMETRY_TOKEN: ${{ secrets.LOREKIT_TELEMETRY_TOKEN }}
      DEPLOYMENT_ENVIRONMENT: test
      LOREKIT_CORRELATION_ID: smoke-preview-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run integration test against preview endpoint
        # Retry once on a transient live-endpoint flake before failing the deploy.
        # The suite self-cleans and re-mints keys per run, so a re-run is safe; a
        # real regression still fails after the second attempt. (The specs' own
        # teardown is also soft-bounded so a slow sweep never fails a green run.)
        run: |
          for attempt in 1 2; do
            pnpm nx test mcp-server -- smoke.integration && break
            rc=$?
            if [ "$attempt" -eq 2 ]; then
              echo "::error::smoke.integration failed after $attempt attempts"
              exit "$rc"
            fi
            echo "::warning::smoke.integration failed (attempt $attempt/2) — retrying in 10s (transient live-endpoint flake)..."
            sleep 10
          done
        env:
          LOREKIT_SMOKE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/mcp
          LOREKIT_SMOKE_TOKEN: ${{ secrets.LOREKIT_SMOKE_TOKEN }}

      # BYOD (bring-your-own-database) round-trip against a self-hosted Supabase
      # project running the same edge function in BYOD mode. Opt-in coverage:
      #   • unset LOREKIT_BYOD_URL / LOREKIT_BYOD_TOKEN → the test self-skips.
      #   • byod-smoke.integration.spec.ts not present yet → --passWithNoTests keeps
      #     the step green (the spec lands with its own PR; this decouples merge
      #     order so a mis-ordered merge can't red the deploy/rollback pipeline).
      # Only a real BYOD assertion failure fails the step.
      - name: Run BYOD integration test (all four scope types)
        run: pnpm nx test mcp-server -- byod-smoke.integration --passWithNoTests
        env:
          LOREKIT_BYOD_URL: ${{ secrets.LOREKIT_BYOD_URL }}
          LOREKIT_BYOD_TOKEN: ${{ secrets.LOREKIT_BYOD_TOKEN }}

      # Reproduce the real onboarding flow end-to-end against the live preview
      # deploy: scaffold the skill + .mcp.json, then `doctor --deep` (skill found,
      # token, endpoint, connectivity, and a self-cleaning write→read→delete
      # round-trip). This is the holistic health gate — the single command that
      # catches a placeholder endpoint, a bad token, an unreachable host, or a
      # broken round-trip in one shot. The zero-dep CLI runs straight from source.
      - name: Onboarding smoke — install, then doctor --deep (live round-trip)
        run: |
          node packages/cli/bin/lorekit.mjs install --project --no-hooks --yes \
            --endpoint "$URL" --token "$TOKEN"
          node packages/cli/bin/lorekit.mjs doctor --deep --endpoint "$URL" --token "$TOKEN"
        env:
          URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/mcp
          TOKEN: ${{ secrets.LOREKIT_SMOKE_TOKEN }}

      # The two script-based smokes ci.yml's integration job runs (against a
      # local Supabase), now replayed against the live preview deploy so the
      # merge gate and the deploy gate assert the same transport + REST contracts.

      # Robust local stdio transport (`lorekit mcp`): spawns the CLI's stdio
      # server in remote-passthrough mode and drives initialize → tools/list →
      # memory.list against the endpoint — proving the transport a `.mcp.json`
      # points at launches and reaches the backend. Same script as ci.yml.
      - name: Smoke — robust stdio transport handshakes against preview
        run: node scripts/smoke-mcp-stdio.mjs "$URL" "$TOKEN"
        env:
          URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/mcp
          TOKEN: ${{ secrets.LOREKIT_SMOKE_TOKEN }}

      # Mint a user JWT so smoke-rest can include the orgs suite. Fixed-user mode
      # (LOREKIT_SMOKE_EMAIL/PASSWORD) — never provisions users in a real tenant,
      # unlike CI's ephemeral mode against a throwaway local stack. Runs only when
      # the optional credentials are configured; otherwise the orgs suite is left
      # out and announced by smoke-rest, never a green suite that tested nothing.
      #
      # BEST-EFFORT: the orgs suite is opt-in, so a mint failure must NOT fail the
      # deploy. mint-smoke-jwt.mjs exits non-zero when the fixed smoke user can't
      # sign in (unseeded/unconfirmed user, wrong password, or email+password
      # sign-in disabled on the project) — do not let that red the pipeline and
      # block promotion to production. On failure we warn loudly and leave the
      # `jwt` output empty, so smoke-rest runs the memories suite only and
      # announces the orgs skip. To ENABLE the orgs suite, seed a confirmed
      # email+password user on this project matching LOREKIT_SMOKE_EMAIL/PASSWORD.
      # (`if <cmd>` suspends `set -e` for the mint, so a failure lands in `else`.)
      - name: Mint a user JWT for the orgs REST smoke (optional)
        id: smokejwt
        if: env.HAVE_ORG_SMOKE_CREDS == 'true'
        env:
          LOREKIT_REST_BASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          LOREKIT_SMOKE_EMAIL: ${{ secrets.LOREKIT_SMOKE_EMAIL }}
          LOREKIT_SMOKE_PASSWORD: ${{ secrets.LOREKIT_SMOKE_PASSWORD }}
        run: |
          if JWT="$(node scripts/mint-smoke-jwt.mjs)"; then
            echo "::add-mask::$JWT"
            echo "jwt=$JWT" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not mint a smoke JWT — the orgs REST suite is skipped this run. Seed a confirmed email+password smoke user (matching LOREKIT_SMOKE_EMAIL/PASSWORD) on this project to enable it."
          fi

      # REST Edge Functions end-to-end against the live preview stack — the
      # `memories` suite always (gated by LOREKIT_SMOKE_TOKEN), the `orgs` suite
      # only when the JWT above was minted. Same script as ci.yml; the specs
      # self-clean with timestamped keys, so this is safe against a live project.
      - name: Smoke — REST API (memories + orgs) against preview
        env:
          LOREKIT_REST_BASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1
          LOREKIT_SMOKE_TOKEN: ${{ secrets.LOREKIT_SMOKE_TOKEN }}
          LOREKIT_SMOKE_JWT: ${{ steps.smokejwt.outputs.jwt }}
        # Retry once on a transient live-endpoint flake. The specs self-clean with
        # per-run timestamped keys, so a re-run is safe; a real failure still fails
        # after the second attempt.
        run: |
          for attempt in 1 2; do
            node scripts/smoke-rest.mjs && break
            rc=$?
            if [ "$attempt" -eq 2 ]; then
              echo "::error::REST smoke failed after $attempt attempts"
              exit "$rc"
            fi
            echo "::warning::REST smoke failed (attempt $attempt/2) — retrying in 10s (transient live-endpoint flake)..."
            sleep 10
          done

      - name: Smoke cleanup — sweep orphaned artefacts from preview
        if: always()
        env:
          LOREKIT_REST_BASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1
          LOREKIT_SMOKE_TOKEN: ${{ secrets.LOREKIT_SMOKE_TOKEN }}
          LOREKIT_SMOKE_JWT: ${{ steps.smokejwt.outputs.jwt }}
        run: node scripts/smoke-cleanup.mjs --min-age-minutes 30

  # ── 3. Deploy to PRODUCTION (only reached if preview is green) ────────────────
  deploy-production:
    name: Deploy → production
    runs-on: ubuntu-latest
    needs: smoke-preview
    environment: production
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Verify production environment secrets are set
        run: |
          missing=""
          [ -z "$PROJECT_REF" ] && missing="$missing SUPABASE_PROJECT_REF"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets for the 'production' environment:$missing. Add them under Settings ▸ Environments ▸ production."
            exit 1
          fi

      - name: Tag deploy in Dash0 (VCS resource attributes)
        run: |
          supabase secrets set \
            VCS_REPOSITORY_URL_FULL="https://github.com/${{ github.repository }}" \
            VCS_REF_HEAD_NAME="${{ github.ref_name }}" \
            VCS_REF_HEAD_REVISION="${{ github.sha }}" \
            VCS_REPOSITORY_NAME="${{ github.repository }}" \
            --project-ref "$PROJECT_REF"

      - name: Link the Supabase project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Push database migrations
        # --include-all applies a migration even when a LOWER-numbered file was
        # merged after a higher-numbered one already reached this remote — which
        # happens when parallel PRs pick colliding sequential prefixes (e.g.
        # #260 shipped 00042, then #266 shipped 00041). Without it `db push`
        # aborts with "migration files to be inserted before the last migration
        # on remote". Migrations are still applied in on-disk numeric order; the
        # PR-time guard (scripts/check-migration-order.mjs, the `migration-order`
        # CI job) is what stops an out-of-order file from landing in the first
        # place, so this flag only ever applies already-reviewed, CI-tested ones.
        run: supabase db push --include-all

      - name: Deploy edge functions (mcp + health)
        # Retry up to 3 times with 10 s back-off to tolerate transient OOM
        # crashes (exit 135 / SIGBUS) from the edge-runtime bundler container.
        run: |
          for attempt in 1 2 3; do
            supabase functions deploy --no-verify-jwt --project-ref "$PROJECT_REF" && break
            rc=$?
            if [ $attempt -eq 3 ]; then
              echo "::error::Edge function deploy failed after $attempt attempts (exit $rc)"
              exit $rc
            fi
            echo "::warning::Edge function deploy failed (exit $rc), retrying in 10 s (attempt $attempt/3)..."
            sleep 10
          done

  # ── 3b. Promote WEB to PRODUCTION (Vercel alias swap) ─────────────────────────
  #    The FE half of the production flip. Runs right after deploy-production (API),
  #    so the frontend goes live in lockstep with the backend it depends on. Because
  #    stage-web-production already built + uploaded the bundle, this is just an alias
  #    swap — near-instant. `needs` deploy-production so the API is in production
  #    BEFORE the new FE is served (a client should never front an older backend);
  #    shares the `production` environment gate.
  promote-web-production:
    name: Promote web → production (Vercel)
    runs-on: ubuntu-latest
    needs: [changes, deploy-production, stage-web-production]
    # Flip the web when it changed (stage-web-production ran) AND either the API
    # did not change (nothing to wait for) or the API's prod deploy succeeded (so
    # the API is live before the FE fronts it). `changes.outputs.api` disambiguates
    # deploy-production's 'skipped' (API unchanged, fine) from a real upstream stop
    # (API changed but its deploy failed / smoke-preview failed → not 'success').
    if: always() && needs.stage-web-production.result == 'success' && (needs.changes.outputs.api == 'false' || needs.deploy-production.result == 'success')
    environment: production
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      STAGED_URL: ${{ needs.stage-web-production.outputs.deployment_url }}
      # The team slug `vercel promote` must run under. See the promote step for
      # why this is REQUIRED (Vercel bug #11712). Defaults to the project's team;
      # matches the hardcoded VERCEL_SCOPE in packages/mcp-core/src/cors-origins.ts.
      # Override with a repo variable if the project moves Vercel accounts.
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || 'mads-thines-projects' }}
    steps:
      # Checkout is required BEFORE pnpm/action-setup — it reads `packageManager`
      # from the repo's package.json (no `version:` is pinned on the action).
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: pnpm add -g vercel@58

      - name: Promote staged build to production
        run: |
          if [ -z "$STAGED_URL" ]; then
            echo "::error::No staged production deployment URL from stage-web-production"
            exit 1
          fi
          # Assign the production domain to the already-built, already-uploaded
          # deployment — the instant alias swap that flips the FE to production.
          #
          # `--scope` is REQUIRED, not optional: `vercel promote` ignores both a
          # team-scoped token AND a linked .vercel/project.json (Vercel bug
          # https://github.com/vercel/vercel/issues/11712), so without it the CLI
          # falls back to the token's DEFAULT team and 403s with "Trying to access
          # resource under scope '<default-team>'". `vercel deploy` (in the stage
          # job) does NOT have this bug, which is why staging worked and only the
          # flip failed. Passing the team slug forces the correct scope.
          vercel promote "$STAGED_URL" --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN" --yes
          echo "### Web production promoted" >> "$GITHUB_STEP_SUMMARY"
          echo "- Promoted \`$STAGED_URL\` to the production domain (scope \`$VERCEL_SCOPE\`)." >> "$GITHUB_STEP_SUMMARY"

  # ── 4. Post-deploy verification against PRODUCTION ───────────────────────────
  smoke-production:
    name: Smoke test → production
    runs-on: ubuntu-latest
    needs: [deploy-production, promote-web-production]
    # Run when EITHER half reached production. The health/MCP curls hit the API
    # (live either way) and the dashboard curl hits the web, so it validates
    # whichever side just flipped and passes against the unchanged side.
    if: always() && (needs.deploy-production.result == 'success' || needs.promote-web-production.result == 'success')
    environment: production
    permissions:
      contents: read
    env:
      # Smoke telemetry — same three knobs as smoke-preview (see the comment
      # there). DEPLOYMENT_ENVIRONMENT=test stamps ALL of this run's smoke spans
      # (cli + api + mcp) with `deployment.environment.name=test` so they filter
      # apart from real PRODUCTION traffic, even though they run against the
      # production deployment; the edge honours only the synthetic `test` value.
      LOREKIT_TELEMETRY_TOKEN: ${{ secrets.LOREKIT_TELEMETRY_TOKEN }}
      DEPLOYMENT_ENVIRONMENT: test
      LOREKIT_CORRELATION_ID: smoke-production-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify health endpoint
        run: |
          URL="https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/health"
          # Tag this smoke request so its edge span reports env=test (job-wide
          # DEPLOYMENT_ENVIRONMENT); the edge honours only the synthetic `test`.
          STATUS=$(curl -sf -H "x-lorekit-deployment-environment: $DEPLOYMENT_ENVIRONMENT" "$URL" | jq -r '.status // "unknown"')
          echo "### Production deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health endpoint status: **${STATUS}**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATUS" != "ok" ]; then
            echo "::error::Production health check returned '${STATUS}'"
            exit 1
          fi

      - name: Verify MCP endpoint responds (tools/list)
        run: |
          URL="https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/mcp"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL" \
            -H "Authorization: Bearer ${{ secrets.LOREKIT_SMOKE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -H "x-lorekit-deployment-environment: $DEPLOYMENT_ENVIRONMENT" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
          echo "- MCP tools/list HTTP: **${CODE}**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CODE" != "200" ]; then
            echo "::error::Production MCP endpoint returned HTTP ${CODE} for tools/list"
            exit 1
          fi

      # The FE half of the production gate: the promoted dashboard must serve. A
      # failure here trips BOTH rollback-production (functions) and
      # rollback-web-production (Vercel), so the FE and API revert together.
      # WEB_PROD_URL overrides the origin for a self-hosted fork; defaults to the
      # canonical dashboard domain.
      - name: Verify web dashboard responds (production)
        env:
          URL: ${{ vars.WEB_PROD_URL || 'https://lorekit.io' }}
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -L "$URL")
          echo "- Web dashboard: $URL (HTTP $CODE)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CODE" -ge 400 ]; then
            echo "::error::Production web dashboard returned HTTP $CODE"
            exit 1
          fi

      # Full authenticated onboarding + round-trip against the live production
      # deploy, mirroring smoke-preview: scaffold skill + config, then
      # `doctor --deep` (self-cleaning write→read→delete). Stronger than the
      # curl checks above — it proves the production write path, not just reachability.
      - name: Onboarding smoke — install, then doctor --deep (live round-trip)
        run: |
          node packages/cli/bin/lorekit.mjs install --project --no-hooks --yes \
            --endpoint "$URL" --token "$TOKEN"
          node packages/cli/bin/lorekit.mjs doctor --deep --endpoint "$URL" --token "$TOKEN"
        env:
          URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/mcp
          TOKEN: ${{ secrets.LOREKIT_SMOKE_TOKEN }}

      # BYOD (bring-your-own-database) round-trip against a self-hosted Supabase
      # project running the same edge function in BYOD mode. Opt-in coverage:
      #   • unset LOREKIT_BYOD_URL / LOREKIT_BYOD_TOKEN → the test self-skips.
      #   • byod-smoke.integration.spec.ts not present yet → --passWithNoTests keeps
      #     the step green (the spec lands with its own PR; this decouples merge
      #     order so a mis-ordered merge can't red the deploy/rollback pipeline).
      # Only a real BYOD assertion failure fails the step.
      - name: Run BYOD integration test (all four scope types)
        run: pnpm nx test mcp-server -- byod-smoke.integration --passWithNoTests
        env:
          LOREKIT_BYOD_URL: ${{ secrets.LOREKIT_BYOD_URL }}
          LOREKIT_BYOD_TOKEN: ${{ secrets.LOREKIT_BYOD_TOKEN }}

      # Robust local stdio transport (`lorekit mcp`): initialize → tools/list →
      # memory.list against the production endpoint — the same script ci.yml runs
      # (against a local Supabase). This one is READ-ONLY (`memory.list`), so it
      # adds no synthetic rows to the production tables and its flake profile
      # matches the tools/list curl above; both gate rollback, which is fine.
      - name: Smoke — robust stdio transport handshakes against production
        run: node scripts/smoke-mcp-stdio.mjs "$URL" "$TOKEN"
        env:
          URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/mcp
          TOKEN: ${{ secrets.LOREKIT_SMOKE_TOKEN }}

      # NOTE: the write-heavy REST smoke (scripts/smoke-rest.mjs) is deliberately
      # NOT run here — it runs in smoke-preview only. Do NOT "restore parity" by
      # re-adding it to production:
      #   • It writes append-only rows (audit_log / usage_events) that no cleanup
      #     can remove, so every prod deploy would leave synthetic audit trail in
      #     the live tenant (the orgs sub-suite adds org.create/member.* on top).
      #   • A flaky live vitest run would then trip rollback-production, auto-
      #     redeploying the previous commit's functions on a test hiccup.
      #   • It is redundant here: smoke-preview already exercised the full REST
      #     contract against the IDENTICAL promoted function bundle on the staging
      #     project before this job runs, and the self-cleaning `doctor --deep`
      #     round-trip above already verifies the production write path.

      - name: Smoke residue check — report anything left in production
        if: always()
        continue-on-error: true
        env:
          LOREKIT_REST_BASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1
          LOREKIT_SMOKE_TOKEN: ${{ secrets.LOREKIT_SMOKE_TOKEN }}
        run: node scripts/smoke-cleanup.mjs --min-age-minutes 30 --dry-run

  # ── 5. Rollback PRODUCTION functions on a production failure ──────────────────
  #    Redeploys the previous commit's edge functions. Migrations are forward-only
  #    (expand/contract + PITR is the DB safety net) so they are intentionally not
  #    reverted here. Gated on ANY production-phase failure — the API deploy, the
  #    web promote, or the shared smoke gate — so the API is reverted whenever the
  #    frontend is (rollback-web-production), keeping FE and API in lockstep. A
  #    failure earlier in the pipeline (preview) skips deploy-production, so none of
  #    these report 'failure' and this rollback does NOT run — prod is never touched
  #    unless a prod deploy was actually attempted.
  rollback-production:
    name: Rollback → production functions
    runs-on: ubuntu-latest
    needs: [deploy-production, promote-web-production, smoke-production]
    # Revert functions ONLY when the API was actually deployed this run
    # (deploy-production ran) and a production-phase failure occurred — its own
    # deploy failed, or (having succeeded) the web promote or the shared smoke
    # then failed, so the API reverts in lockstep with the web. If the API was
    # unchanged (deploy-production skipped), the functions were never touched and
    # are left alone even if the web half failed.
    if: always() && (needs.deploy-production.result == 'failure' || (needs.deploy-production.result == 'success' && (needs.promote-web-production.result == 'failure' || needs.smoke-production.result == 'failure')))
    environment: production
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout repository (with previous commit)
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - name: Restore previous commit's function code
        run: git checkout HEAD~1 -- supabase/functions supabase/config.toml

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Redeploy previous edge functions
        run: supabase functions deploy --no-verify-jwt --project-ref "$PROJECT_REF"

      - name: Report rollback
        run: |
          echo "### ⚠️ Production rollback executed" >> "$GITHUB_STEP_SUMMARY"
          echo "Edge functions were rolled back to \`$(git rev-parse HEAD~1)\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Database migrations were **not** reverted (forward-only)." >> "$GITHUB_STEP_SUMMARY"
          echo "Inspect the failing job above and, if a migration is at fault, restore via PITR." >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Production deploy failed — functions rolled back to the previous commit."
          exit 1

  # ── 5b. Rollback PRODUCTION web on a production failure (Vercel) ──────────────
  #    Reverts the production domain to the deployment that was live before this
  #    pipeline promoted the new one, so the FE reverts in lockstep with the edge
  #    functions. Runs ONLY when the web was actually promoted this run: the
  #    promote failed, or the promote succeeded but the shared production smoke
  #    then failed. If deploy-production (API) failed first, promote is skipped and
  #    the web was never touched — so this stays out and only the functions revert.
  rollback-web-production:
    name: Rollback → production web (Vercel)
    runs-on: ubuntu-latest
    needs: [promote-web-production, smoke-production]
    # Roll back the web ONLY when the promote SUCCEEDED (the alias was actually
    # swapped to this run's deployment) and the shared production smoke then failed.
    # A FAILED promote never swapped the alias — production is still on the previous
    # healthy deployment — so `vercel rollback` there would revert a good deployment
    # to an even-older one. On a failed promote the functions revert instead
    # (rollback-production), which is what restores FE↔API lockstep (old web that
    # never moved + reverted functions).
    if: always() && needs.promote-web-production.result == 'success' && needs.smoke-production.result == 'failure'
    environment: production
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Same team-scope requirement as promote-web-production (Vercel bug #11712).
      VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE || 'mads-thines-projects' }}
    steps:
      # Checkout is required BEFORE pnpm/action-setup — it reads `packageManager`
      # from the repo's package.json (no `version:` is pinned on the action).
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: pnpm add -g vercel@58

      - name: Roll back production web to the previous deployment
        run: |
          # `vercel rollback` with no target reverts to the deployment immediately
          # prior to the current production deployment — i.e. the one live before
          # this run's (now-promoted) deployment. `--scope` is REQUIRED for the
          # same reason as promote (Vercel bug #11712 — rollback ignores the
          # token's team and the linked project). Best-effort: rollback-production
          # already fails the run loudly, so a rollback hiccup here is a warning,
          # not a second hard fail.
          if vercel rollback --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN" --yes; then
            echo "### ⚠️ Production web rolled back" >> "$GITHUB_STEP_SUMMARY"
            echo "The production domain was reverted to the previous Vercel deployment." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::vercel rollback failed — roll the production web back manually from the Vercel dashboard."
          fi

  # ── 6. Notify Discord on ANY deploy-pipeline failure ─────────────────────────
  #    Fires when any job above reports 'failure' — a deploy step, a smoke gate, or
  #    a rollback. Posts a single embed to the DISCORD_WEBHOOK_URL webhook so a
  #    red production deploy reaches you outside the Actions UI (the failure the
  #    smoke tests would otherwise report only there). If the webhook secret is
  #    unset the job no-ops with a warning and never fails the run itself — the
  #    real failure is already reported loudly by the job that broke.
  #    The posting logic itself lives in the shared ./.github/actions/discord-notify
  #    composite action (also used by release.yml); this job only decides WHICH
  #    stage failed and passes it in. The stage name is derived via `env:` (never
  #    interpolated into the shell) to avoid workflow script injection.
  notify-failure:
    name: Notify on failure (Discord + Dash0)
    runs-on: ubuntu-latest
    needs: [changes, deploy-preview, deploy-web-preview, stage-web-production, smoke-preview, deploy-production, promote-web-production, smoke-production, rollback-production, rollback-web-production]
    if: always() && contains(needs.*.result, 'failure')
    permissions:
      contents: read # checkout, so the local composite action is available
    steps:
      - name: Checkout repository (for the composite action)
        uses: actions/checkout@v7.0.1

      - name: Identify the failed stage
        id: stage
        env:
          RESULT_CHANGES: ${{ needs.changes.result }}
          RESULT_DEPLOY_PREVIEW: ${{ needs.deploy-preview.result }}
          RESULT_DEPLOY_WEB_PREVIEW: ${{ needs.deploy-web-preview.result }}
          RESULT_STAGE_WEB_PRODUCTION: ${{ needs.stage-web-production.result }}
          RESULT_SMOKE_PREVIEW: ${{ needs.smoke-preview.result }}
          RESULT_DEPLOY_PRODUCTION: ${{ needs.deploy-production.result }}
          RESULT_PROMOTE_WEB_PRODUCTION: ${{ needs.promote-web-production.result }}
          RESULT_SMOKE_PRODUCTION: ${{ needs.smoke-production.result }}
          RESULT_ROLLBACK: ${{ needs.rollback-production.result }}
          RESULT_ROLLBACK_WEB: ${{ needs.rollback-web-production.result }}
        run: |
          # Name the first pipeline stage that failed (top-to-bottom = root cause;
          # rollback failing is a symptom of a prod-job failure listed before it).
          failed="an unknown stage"
          if   [ "$RESULT_CHANGES"                = "failure" ]; then failed="detect changes"
          elif [ "$RESULT_DEPLOY_PREVIEW"         = "failure" ]; then failed="deploy → preview"
          elif [ "$RESULT_DEPLOY_WEB_PREVIEW"     = "failure" ]; then failed="web deploy → preview"
          elif [ "$RESULT_STAGE_WEB_PRODUCTION"   = "failure" ]; then failed="web build (production staging)"
          elif [ "$RESULT_SMOKE_PREVIEW"          = "failure" ]; then failed="smoke tests → preview"
          elif [ "$RESULT_DEPLOY_PRODUCTION"      = "failure" ]; then failed="deploy → production"
          elif [ "$RESULT_PROMOTE_WEB_PRODUCTION" = "failure" ]; then failed="web promote → production"
          elif [ "$RESULT_SMOKE_PRODUCTION"       = "failure" ]; then failed="smoke test → production"
          elif [ "$RESULT_ROLLBACK"               = "failure" ]; then failed="production (functions rolled back to previous commit)"
          elif [ "$RESULT_ROLLBACK_WEB"           = "failure" ]; then failed="production web rollback"
          fi
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Post failure notification to Discord
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          username: LoreKit Deploy
          title: '🔴 Production deploy failed'
          failed-stage: ${{ steps.stage.outputs.failed }}

      - name: Post failure event to Dash0
        uses: ./.github/actions/dash0-notify
        with:
          webhook-url: ${{ secrets.DASH0_WEBHOOK_URL }}
          failed-stage: ${{ steps.stage.outputs.failed }}
