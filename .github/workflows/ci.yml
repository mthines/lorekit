# ─────────────────────────────────────────────────────────────────────────────
# CI — validation gate for pull requests.
#
# This is where tests run, on PRs targeting main. It runs on `pull_request`
# only (not `push`) so a PR branch is validated exactly once per commit instead
# of twice (a push event + a pull_request event both firing). `main` is handled
# by deploy.yml, which trusts these required checks and does NOT re-run the suite.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  pull_request:
    branches: [main]

# One run per PR; a newer push cancels the in-flight run to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # ── Detect whether API/backend code changed ──────────────────────────────────
  #    Gates the (expensive) integration job so a docs- or web-only change does
  #    not boot a local Supabase. Unit typecheck/test/lint is NOT gated here —
  #    `nx affected` in `check` already scopes itself to the changed packages.
  changes:
    name: Detect API changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare changed paths against the API globs
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            BASE="$PR_BASE"
          else
            BASE="$BEFORE"
          fi
          # Fall back to the parent commit for first pushes / missing base SHAs.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "Comparing ${BASE}...HEAD"
          CHANGED="$(git diff --name-only "${BASE}" HEAD)"
          echo "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -qE '^(packages/mcp-core/|packages/mcp-server/|supabase/functions/|supabase/migrations/|supabase/config\.toml|package\.json|pnpm-lock\.yaml|\.github/workflows/ci\.yml)'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Typecheck + Test + Lint (only affected packages) ─────────────────────────
  check:
    name: Typecheck, Test & Lint (affected)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # NX affected needs history to diff against the base

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: NX — typecheck, test, lint (affected)
        run: pnpm nx affected -t typecheck,test,lint --parallel=3
        env:
          NX_BASE: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          NX_HEAD: ${{ github.sha }}

  # ── Integration smoke — live stack wiring on a local Supabase ────────────────
  #    Boots a full local stack (migrations applied → serves the real Edge
  #    Functions) and asserts an authenticated MCP tools/list returns 200. That
  #    proves migrations apply, the functions boot/import/serve, and auth is
  #    wired end-to-end — the checks that translate faithfully from local to prod.
  #
  #    The full write/read/list/search/delete round-trip runs in deploy.yml's
  #    smoke-staging against the real staging project. It is intentionally NOT run
  #    here: the local edge runtime bundles an older PostgREST that can't resolve
  #    the `UNIQUE NULLS NOT DISTINCT (user_id, scope, key)` upsert arbiter for
  #    service-role writes (user_id null) — a local-only quirk. Real writes use a
  #    non-null user_id (lk_rw token / JWT), covered by mcp-core unit tests here
  #    and by smoke-staging against current PostgREST.
  integration:
    name: Integration smoke (local Supabase)
    runs-on: ubuntu-latest
    needs: [check, changes]
    # Only run when API/backend code changed. A skipped required check is treated
    # as passing by branch protection, so this does not block docs/web-only PRs.
    if: needs.changes.outputs.api == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (applies migrations, serves functions)
        run: supabase start

      - name: Lint database schema (informational)
        run: supabase db lint --level warning || true

      - name: Capture local service-role key
        id: supabase
        run: |
          supabase status -o json > /tmp/status.json
          # The service-role key the edge runtime injects as SUPABASE_SERVICE_ROLE_KEY.
          # Field name varies by CLI version (legacy SERVICE_ROLE_KEY vs newer SECRET_KEY).
          KEY="$(jq -r '.SERVICE_ROLE_KEY // .SECRET_KEY // .service_role_key // empty' /tmp/status.json)"
          if [ -z "$KEY" ]; then
            echo "::error::No service-role/secret key in supabase status. Available keys:"
            jq -r 'keys[]' /tmp/status.json
            exit 1
          fi
          echo "::add-mask::$KEY"
          echo "service_role_key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Smoke — authenticated MCP tools/list returns 200
        env:
          TOKEN: ${{ steps.supabase.outputs.service_role_key }}
        run: |
          for i in $(seq 1 40); do
            CODE=$(curl -s --max-time 30 -o /tmp/mcp.out -w '%{http_code}' \
              -X POST http://127.0.0.1:54321/functions/v1/mcp \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json, text/event-stream" \
              -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "MCP stack healthy (migrations applied, functions serving, auth OK, tools/list → 200)"
              exit 0
            fi
            echo "attempt $i: HTTP $CODE"
            sleep 3
          done
          echo "::error::MCP endpoint did not return 200 for an authenticated tools/list"
          echo '--- last response body ---'; cat /tmp/mcp.out || true
          echo '--- edge runtime logs ---'; docker logs supabase_edge_runtime_lorekit 2>&1 | tail -80 || true
          exit 1

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
