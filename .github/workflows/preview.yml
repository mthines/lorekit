# ─────────────────────────────────────────────────────────────────────────────
# Preview deploy — triggered by a `/preview` comment on a PR.
#
# Flow:
#   1. A maintainer (OWNER / MEMBER / COLLABORATOR) comments `/preview` on a PR.
#   2. Guard job validates commenter, adds 👀 reaction, resolves PR head SHA.
#   3. deploy-api: deploys Supabase edge functions + migrations to the
#      `preview` environment from the PR's pinned head SHA.
#   4. deploy-web: builds Next.js and deploys a Vercel preview (not promoted
#      to production). Posts the preview URL.
#   5. smoke: runs the same smoke tests as deploy.yml's smoke-preview job.
#   6. report: posts a PR comment with results table + endpoint URLs.
#
# Required secrets:
#   preview environment: SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD,
#                        SUPABASE_ACCESS_TOKEN, LOREKIT_SMOKE_TOKEN
#   repository level:    VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   optional:            DISCORD_WEBHOOK_URL
#
# Security: issue_comment reads from main's workflow file (not the PR branch).
# PR head is checked out by pinned SHA, not a user-controllable ref.
# Only OWNER/MEMBER/COLLABORATOR comments are acted on.
# ─────────────────────────────────────────────────────────────────────────────

name: Preview Deploy

on:
  issue_comment:
    types: [created]

concurrency:
  group: preview-deploy-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  guard:
    name: Check trigger conditions
    runs-on: ubuntu-latest
    if: >
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/preview')
    permissions:
      pull-requests: write
      statuses: write
    outputs:
      authorized: ${{ steps.check.outputs.authorized }}
      pr_number: ${{ github.event.issue.number }}
      pr_sha: ${{ steps.pr.outputs.sha }}
      pr_branch: ${{ steps.pr.outputs.branch }}
    steps:
      - name: Check commenter authorization
        id: check
        env:
          ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          case "$ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR)
              echo "authorized=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "authorized=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Add 👀 reaction
        if: steps.check.outputs.authorized == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes',
            });

      - name: Resolve PR head SHA and branch
        if: steps.check.outputs.authorized == 'true'
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.issue.number,
            });
            core.setOutput('sha', pr.data.head.sha);
            core.setOutput('branch', pr.data.head.ref);

      - name: Set pending status check
        if: steps.check.outputs.authorized == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ steps.pr.outputs.sha }}',
              state: 'pending',
              context: 'Preview Deploy',
              description: 'Preview deploy in progress…',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  deploy-api:
    name: Deploy API → preview
    runs-on: ubuntu-latest
    needs: guard
    if: needs.guard.outputs.authorized == 'true'
    environment: preview
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.pr_sha }}

      - name: Install Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest

      - name: Verify required secrets
        run: |
          missing=""
          [ -z "$PROJECT_REF" ] && missing="$missing SUPABASE_PROJECT_REF"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            exit 1
          fi

      - name: Tag deploy in Dash0
        run: |
          supabase secrets set \
            VCS_REPOSITORY_URL_FULL="https://github.com/${{ github.repository }}" \
            VCS_REF_HEAD_NAME="${{ needs.guard.outputs.pr_branch }}" \
            VCS_REF_HEAD_REVISION="${{ needs.guard.outputs.pr_sha }}" \
            VCS_REPOSITORY_NAME="${{ github.repository }}" \
            --project-ref "$PROJECT_REF"

      - name: Link Supabase project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Apply database migrations
        run: supabase db push

      - name: Deploy edge functions
        run: supabase functions deploy --no-verify-jwt --project-ref "$PROJECT_REF"

  deploy-web:
    name: Deploy web → Vercel preview
    runs-on: ubuntu-latest
    needs: guard
    if: needs.guard.outputs.authorized == 'true'
    environment: preview
    permissions:
      contents: read
    outputs:
      vercel_url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.pr_sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: pnpm add -g vercel

      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=preview

      # Overrides the Vercel-pulled preview vars with staging values by
      # rewriting the env file `vercel pull` produced and `vercel build`
      # actually reads (.vercel/.env.preview.local). Editing this file — not
      # .env.local — is what guarantees the override: `vercel build` injects
      # these values into process.env, and Next.js never lets a .env.local
      # entry override a variable already set in process.env. We strip any
      # pulled NEXT_PUBLIC_SUPABASE_* lines first so ours are the only
      # definitions. This mutates only the runner's local copy for this one
      # build; push-triggered Vercel previews never run this workflow, so
      # their env is unchanged.
      - name: Override Supabase config with staging values
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          ENV_FILE=".vercel/.env.preview.local"
          if [ ! -f "$ENV_FILE" ]; then
            echo "::error::$ENV_FILE not found — did 'vercel pull' run?"
            exit 1
          fi
          # Drop any pulled Supabase vars so ours are the only definitions.
          grep -vE '^(NEXT_PUBLIC_SUPABASE_URL|NEXT_PUBLIC_SUPABASE_ANON_KEY|NEXT_PUBLIC_SUPABASE_PROJECT_REF)=' \
            "$ENV_FILE" > "$ENV_FILE.tmp" || true
          mv "$ENV_FILE.tmp" "$ENV_FILE"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=https://${PROJECT_REF}.supabase.co"
            echo "NEXT_PUBLIC_SUPABASE_PROJECT_REF=${PROJECT_REF}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
          } >> "$ENV_FILE"

      - name: Build Vercel preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build

      - name: Deploy to Vercel preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # Vercel prints the deployment URL to stdout and progress to stderr;
          # keep them separate (no 2>&1) and grep the URL so a trailing stderr
          # line can never be mistaken for the deployment URL.
          deploy_out="$(vercel deploy --prebuilt)"
          echo "$deploy_out"
          URL="$(printf '%s\n' "$deploy_out" | grep -Eo 'https://[^[:space:]]+' | tail -1)"
          if [ -z "$URL" ]; then
            echo "::error::Could not parse Vercel deployment URL"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  smoke:
    name: Smoke test → preview API
    runs-on: ubuntu-latest
    needs: [guard, deploy-api]
    if: needs.guard.outputs.authorized == 'true'
    environment: preview
    permissions:
      contents: read
    env:
      # Gate for the optional orgs REST smoke suite. The org endpoints require a
      # Supabase USER JWT (lk_* tokens and the service-role key are rejected), so
      # it runs only when a fixed smoke user is configured. Mapped from secrets
      # here so a step `if:` can read it — a step `if:` cannot reference secrets
      # via env of the same step. Unset → the suite self-skips (announced).
      HAVE_ORG_SMOKE_CREDS: ${{ secrets.LOREKIT_SMOKE_EMAIL != '' && secrets.LOREKIT_SMOKE_PASSWORD != '' && secrets.SUPABASE_ANON_KEY != '' }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.pr_sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run MCP server smoke tests
        # Retry once on a transient live-endpoint flake (kept in lockstep with
        # deploy.yml's smoke-preview). The suite self-cleans and re-mints keys per
        # run, so a re-run is safe; a real regression still fails after attempt 2.
        run: |
          for attempt in 1 2; do
            pnpm nx test mcp-server -- smoke.integration && break
            rc=$?
            if [ "$attempt" -eq 2 ]; then
              echo "::error::smoke.integration failed after $attempt attempts"
              exit "$rc"
            fi
            echo "::warning::smoke.integration failed (attempt $attempt/2) — retrying in 10s (transient live-endpoint flake)..."
            sleep 10
          done
        env:
          LOREKIT_SMOKE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/mcp
          LOREKIT_SMOKE_TOKEN: ${{ secrets.LOREKIT_SMOKE_TOKEN }}

      # BYOD (bring-your-own-database) round-trip against a self-hosted Supabase
      # project running the same edge function in BYOD mode. Kept in lock-step
      # with deploy.yml's smoke-preview so a `/preview` run on the PR exercises
      # the SAME suite the post-merge deploy gate does — otherwise a BYOD-only
      # regression (e.g. an under-provisioned test timeout) first surfaces on
      # main. Opt-in coverage:
      #   • unset LOREKIT_BYOD_URL / LOREKIT_BYOD_TOKEN → the test self-skips.
      #   • byod-smoke.integration.spec.ts absent → --passWithNoTests keeps it green.
      # Only a real BYOD assertion failure fails the step.
      - name: Run BYOD integration test (all four scope types)
        run: pnpm nx test mcp-server -- byod-smoke.integration --passWithNoTests
        env:
          LOREKIT_BYOD_URL: ${{ secrets.LOREKIT_BYOD_URL }}
          LOREKIT_BYOD_TOKEN: ${{ secrets.LOREKIT_BYOD_TOKEN }}

      - name: Onboarding smoke (doctor --deep)
        run: |
          node packages/cli/bin/lorekit.mjs install --project --no-hooks --yes \
            --endpoint "$URL" --token "$TOKEN"
          node packages/cli/bin/lorekit.mjs doctor --deep --endpoint "$URL" --token "$TOKEN"
        env:
          URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/mcp
          TOKEN: ${{ secrets.LOREKIT_SMOKE_TOKEN }}

      # Robust local stdio transport (`lorekit mcp`): spawns the CLI's stdio
      # server in remote-passthrough mode and drives initialize → tools/list →
      # memory.list against the endpoint — proving the transport a `.mcp.json`
      # points at launches and reaches the backend. Same script as deploy.yml.
      - name: Smoke — robust stdio transport handshakes against preview
        run: node scripts/smoke-mcp-stdio.mjs "$URL" "$TOKEN"
        env:
          URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/mcp
          TOKEN: ${{ secrets.LOREKIT_SMOKE_TOKEN }}

      # Mint a user JWT so smoke-rest can include the orgs suite. Fixed-user mode
      # (LOREKIT_SMOKE_EMAIL/PASSWORD) — never provisions users in a real tenant.
      # Runs only when the optional credentials are configured; otherwise the
      # orgs suite is left out and announced by smoke-rest, never a green suite
      # that tested nothing.
      #
      # BEST-EFFORT: the orgs suite is opt-in, so a mint failure must NOT fail the
      # preview run. mint-smoke-jwt.mjs exits non-zero when the fixed smoke user
      # can't sign in (unseeded/unconfirmed user, wrong password, or email+password
      # sign-in disabled on the project) — do not let that red the preview. On
      # failure we warn loudly and leave the `jwt` output empty, so smoke-rest runs
      # the memories suite only and announces the orgs skip.
      # (`if <cmd>` suspends `set -e` for the mint, so a failure lands in `else`.)
      - name: Mint a user JWT for the orgs REST smoke (optional)
        id: smokejwt
        if: env.HAVE_ORG_SMOKE_CREDS == 'true'
        env:
          LOREKIT_REST_BASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          LOREKIT_SMOKE_EMAIL: ${{ secrets.LOREKIT_SMOKE_EMAIL }}
          LOREKIT_SMOKE_PASSWORD: ${{ secrets.LOREKIT_SMOKE_PASSWORD }}
        run: |
          if JWT="$(node scripts/mint-smoke-jwt.mjs)"; then
            echo "::add-mask::$JWT"
            echo "jwt=$JWT" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not mint a smoke JWT — the orgs REST suite is skipped this run. Seed a confirmed email+password smoke user (matching LOREKIT_SMOKE_EMAIL/PASSWORD) on this project to enable it."
          fi

      # REST Edge Functions end-to-end against the live preview stack — the
      # `memories` suite always (gated by LOREKIT_SMOKE_TOKEN), the `orgs` suite
      # only when the JWT above was minted. Same script as deploy.yml; the specs
      # self-clean with timestamped keys, so this is safe against a live project.
      - name: Smoke — REST API (memories + orgs) against preview
        env:
          LOREKIT_REST_BASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1
          LOREKIT_SMOKE_TOKEN: ${{ secrets.LOREKIT_SMOKE_TOKEN }}
          LOREKIT_SMOKE_JWT: ${{ steps.smokejwt.outputs.jwt }}
        # Retry once on a transient live-endpoint flake (lockstep with deploy.yml).
        # Specs self-clean with per-run timestamped keys, so a re-run is safe.
        run: |
          for attempt in 1 2; do
            node scripts/smoke-rest.mjs && break
            rc=$?
            if [ "$attempt" -eq 2 ]; then
              echo "::error::REST smoke failed after $attempt attempts"
              exit "$rc"
            fi
            echo "::warning::REST smoke failed (attempt $attempt/2) — retrying in 10s (transient live-endpoint flake)..."
            sleep 10
          done

  report:
    name: Post result comment
    runs-on: ubuntu-latest
    if: always() && needs.guard.outputs.authorized == 'true'
    needs: [guard, deploy-api, deploy-web, smoke]
    environment: preview
    permissions:
      pull-requests: write
      statuses: write
    steps:
      - name: Post deploy results to PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULT_DEPLOY_API: ${{ needs.deploy-api.result }}
          RESULT_DEPLOY_WEB: ${{ needs.deploy-web.result }}
          RESULT_SMOKE: ${{ needs.smoke.result }}
          VERCEL_URL: ${{ needs.deploy-web.outputs.vercel_url }}
          PR_SHA: ${{ needs.guard.outputs.pr_sha }}
          PR_BRANCH: ${{ needs.guard.outputs.pr_branch }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        with:
          script: |
            const icon = r => r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌';
            const api   = process.env.RESULT_DEPLOY_API;
            const web   = process.env.RESULT_DEPLOY_WEB;
            const smoke = process.env.RESULT_SMOKE;
            const vUrl  = process.env.VERCEL_URL || '';
            const hasWeb = /^https?:\/\//.test(vUrl);
            const webLink = hasWeb ? `[${vUrl}](${vUrl})` : '(not available)';
            const sha   = process.env.PR_SHA.slice(0, 7);
            const branch = process.env.PR_BRANCH;
            const ref   = process.env.SUPABASE_PROJECT_REF;
            const apiUrl = ref ? `https://${ref}.supabase.co/functions/v1/mcp` : '(not available)';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const ok    = [api, smoke].every(r => r === 'success');
            const body  = [
              `### ${ok ? '✅ Preview deploy succeeded' : '❌ Preview deploy failed'}`,
              '',
              `Branch: \`${branch}\` @ \`${sha}\``,
              ...(hasWeb ? ['', `🔗 **[Open preview → ${vUrl}](${vUrl})**`] : []),
              '',
              '| Step | Result |',
              '| ---- | ------ |',
              `| API (Supabase edge functions + migrations) | ${icon(api)} ${api} |`,
              `| Web (Vercel preview) | ${icon(web)} ${web} |`,
              `| Smoke tests | ${icon(smoke)} ${smoke} |`,
              '',
              '**Endpoints:**',
              `- API: ${apiUrl}`,
              `- Web: ${webLink}`,
              '',
              `[View workflow run](${runUrl})`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body,
            });
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: ok ? 'rocket' : 'confused',
            });
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.PR_SHA,
              state: ok ? 'success' : 'failure',
              context: 'Preview Deploy',
              description: ok ? 'Preview deploy succeeded' : 'Preview deploy failed',
              target_url: runUrl,
            });
