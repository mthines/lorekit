# ─────────────────────────────────────────────────────────────────────────────
# Release — automated, conventional-commit-driven versioning for @lorekit/cli.
#
# Two-phase, runs on every push to main:
#
#   1. release-please reads the conventional commits since the last release and
#      maintains a single "release PR" that bumps packages/cli/package.json and
#      writes packages/cli/CHANGELOG.md. Feature merges just keep that PR up to
#      date — nothing is published. This job then turns on GitHub auto-merge for
#      that PR, so it lands itself the moment required CI passes — no human merge.
#   2. Auto-merge lands the release PR once CI is green; the resulting push
#      carries the release commit; release-please then creates the git tag +
#      GitHub Release and sets `release_created=true`, which gates the publish
#      job below. The job checks out the (now version-bumped) main and publishes
#      to npm.
#
# Auth:
#   • release-please runs as a GitHub App (create-github-app-token) rather than
#     the default GITHUB_TOKEN. This is required, not cosmetic: a PR opened by
#     the default token does NOT trigger other workflows, so the release PR
#     would never run ci.yml's required `check` and could not be merged. The App
#     mints a short-lived token per run — no long-lived PAT to rotate.
#   • npm publish uses Trusted Publishing (OIDC) via `id-token: write` — no
#     NPM_TOKEN. Configure the trusted publisher on npmjs.com to point at THIS
#     workflow file (release.yml), not deploy.yml.
#
# One-time setup (see docs/releasing.md):
#   • GitHub App with contents:write + pull-requests:write, installed on the
#     repo; store its id as repo VARIABLE RELEASE_APP_ID (a variable so this
#     workflow can gate on it) and its private key as secret
#     RELEASE_APP_PRIVATE_KEY. Until the variable is set, this workflow no-ops.
#   • npm ▸ @lorekit/cli ▸ Settings ▸ Trusted Publisher ▸ GitHub Actions:
#     repo mthines/lorekit, workflow release.yml.
#
# Failure alerts:
#   • Optional repo-level secret DISCORD_WEBHOOK_URL — when set, notify-failure
#     posts a red embed (deep link to the run + commit/branch/actor) to Discord
#     if release-please or the npm publish fails. Unset → the job no-ops with a
#     warning and never fails the run. Same webhook + shared composite action as
#     deploy.yml (./.github/actions/discord-notify).
# ─────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    branches: [main]

permissions: {}

# Never overlap release runs on the same branch.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. Maintain the release PR / cut the release ─────────────────────────────
  release-please:
    name: Release please
    runs-on: ubuntu-latest
    # No-op until the release credentials exist. RELEASE_APP_ID is a repo
    # *variable* (not a secret) precisely so it can gate here — secrets can't be
    # read in `if:`. Before setup this job (and publish-cli, which needs it)
    # skips cleanly instead of failing red on every push to main.
    if: ${{ vars.RELEASE_APP_ID != '' }}
    permissions:
      contents: write # create tags + GitHub releases
      pull-requests: write # open/update the release PR
    outputs:
      cli_release_created: ${{ steps.rp.outputs['packages/cli--release_created'] }}
      cli_tag: ${{ steps.rp.outputs['packages/cli--tag_name'] }}
    steps:
      - name: Mint a GitHub App token (so the release PR triggers required CI)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: rp
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Merge the release PR with zero human intervention. We enable GitHub's
      # native auto-merge rather than merging outright: GitHub queues the merge
      # and completes it only once the branch's required status checks (ci.yml's
      # `check` + `integration`) go green — the App token above is exactly what
      # let the release PR trigger those checks. The next push to main then cuts
      # the tag + release and gates publish-cli. `pr` is set only when a release
      # PR was opened/updated this run (empty on the push that merges it), so the
      # guard keeps this a clean no-op otherwise. Requires the repo's "Allow
      # auto-merge" setting to be on (see docs/releasing.md).
      - name: Auto-merge the release PR
        if: ${{ steps.rp.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_PR: ${{ steps.rp.outputs.pr }}
        run: |
          pr_number=$(jq -r '.number' <<< "$RELEASE_PR")
          echo "Enabling auto-merge on release PR #$pr_number"
          gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --auto --squash

  # ── 2. Publish to npm — only when a release was actually cut ─────────────────
  publish-cli:
    name: Publish @lorekit/cli to npm
    needs: release-please
    if: needs.release-please.outputs.cli_release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mint the OIDC token npm trades for publish rights
    steps:
      - name: Checkout the release commit (version already bumped on main)
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      # Pinned, not @latest: Trusted Publishing landed in 11.5.1, and a pinned
      # version keeps the publish reproducible.
      - name: Upgrade npm for Trusted Publishing (needs >= 11.5.1)
        run: npm install -g npm@11.5.1

      - name: Test
        working-directory: packages/cli
        run: node --test test/*.test.mjs

      # Pre-publish smoke: pack the CLI and run `install` THROUGH npx into a temp
      # project, asserting the wired hooks use the `npx -y @lorekit/cli` runner
      # and never a bare `lorekit` (which only resolves inside npx's transient
      # PATH and dies with `command not found` once npx exits). A broken CLI must
      # not reach the publish step below.
      - name: Smoke-test the packaged CLI (npx install wiring)
        run: node packages/cli/test/smoke-npx-install.mjs

      # Bake the Dash0 ingesting-only telemetry token into the tarball. The token
      # lives only in the LOREKIT_TELEMETRY_TOKEN secret, never in git — this
      # rewrites src/telemetry-token.mjs in the checkout just before publish. If
      # the secret is unset the script no-ops and the CLI publishes with default
      # telemetry off.
      - name: Inject telemetry token
        env:
          LOREKIT_TELEMETRY_TOKEN: ${{ secrets.LOREKIT_TELEMETRY_TOKEN }}
        run: node scripts/inject-telemetry-token.mjs

      # No NODE_AUTH_TOKEN: npm authenticates via the Actions OIDC trusted
      # publisher. release-please guarantees the version is new, so no guard.
      - name: Publish (Trusted Publishing / OIDC)
        working-directory: packages/cli
        run: npm publish --access public --provenance

      - name: Report publish
        run: |
          echo "### 📦 Published ${{ needs.release-please.outputs.cli_tag }} to npm" >> "$GITHUB_STEP_SUMMARY"
          echo "\`npm install -g @lorekit/cli@latest\`" >> "$GITHUB_STEP_SUMMARY"

  # ── 3. Notify Discord on ANY release-workflow failure ────────────────────────
  #    Fires when release-please (maintaining the release PR / cutting the tag /
  #    auto-merge) or publish-cli (test, smoke, npm publish) reports 'failure' —
  #    the release failures that otherwise surface only in the Actions UI. Posts a
  #    single embed to DISCORD_WEBHOOK_URL via the shared composite action (also
  #    used by deploy.yml). When neither job ran (RELEASE_APP_ID unset → both
  #    'skipped') there is no 'failure' and this job is a clean no-op; when the
  #    webhook secret is unset the action itself no-ops with a warning. The failed
  #    stage flows through `env:` (never interpolated) to avoid script injection.
  notify-failure:
    name: Notify on failure (Discord + Dash0)
    runs-on: ubuntu-latest
    needs: [release-please, publish-cli]
    if: always() && contains(needs.*.result, 'failure')
    permissions:
      contents: read # checkout, so the local composite action is available
    steps:
      - name: Checkout repository (for the composite action)
        uses: actions/checkout@v7.0.1

      - name: Identify the failed stage
        id: stage
        env:
          RESULT_RELEASE_PLEASE: ${{ needs.release-please.result }}
          RESULT_PUBLISH_CLI: ${{ needs.publish-cli.result }}
        run: |
          failed="an unknown stage"
          if   [ "$RESULT_RELEASE_PLEASE" = "failure" ]; then failed="release automation (release PR / tag / auto-merge)"
          elif [ "$RESULT_PUBLISH_CLI"    = "failure" ]; then failed="publish @lorekit/cli to npm"
          fi
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Post failure notification to Discord
        uses: ./.github/actions/discord-notify
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          username: LoreKit Release
          title: '🔴 Release workflow failed'
          failed-stage: ${{ steps.stage.outputs.failed }}

      - name: Post failure event to Dash0
        uses: ./.github/actions/dash0-notify
        with:
          webhook-url: ${{ secrets.DASH0_WEBHOOK_URL }}
          failed-stage: ${{ steps.stage.outputs.failed }}
