# ─────────────────────────────────────────────────────────────────────────────
# Release — automated, conventional-commit-driven versioning for @lorekit/cli.
#
# Two-phase, runs on every push to main:
#
#   1. release-please reads the conventional commits since the last release and
#      maintains a single "release PR" that bumps packages/cli/package.json and
#      writes packages/cli/CHANGELOG.md. Feature merges just keep that PR up to
#      date — nothing is published.
#   2. When you merge that release PR, the resulting push carries the release
#      commit; release-please then creates the git tag + GitHub Release and sets
#      `release_created=true`, which gates the publish job below. The job checks
#      out the (now version-bumped) main and publishes to npm.
#
# Auth:
#   • release-please runs as a GitHub App (create-github-app-token) rather than
#     the default GITHUB_TOKEN. This is required, not cosmetic: a PR opened by
#     the default token does NOT trigger other workflows, so the release PR
#     would never run ci.yml's required `check` and could not be merged. The App
#     mints a short-lived token per run — no long-lived PAT to rotate.
#   • npm publish uses Trusted Publishing (OIDC) via `id-token: write` — no
#     NPM_TOKEN. Configure the trusted publisher on npmjs.com to point at THIS
#     workflow file (release.yml), not deploy.yml.
#
# One-time setup (see docs/releasing.md):
#   • GitHub App with contents:write + pull-requests:write, installed on the
#     repo; store its id as repo VARIABLE RELEASE_APP_ID (a variable so this
#     workflow can gate on it) and its private key as secret
#     RELEASE_APP_PRIVATE_KEY. Until the variable is set, this workflow no-ops.
#   • npm ▸ @lorekit/cli ▸ Settings ▸ Trusted Publisher ▸ GitHub Actions:
#     repo mthines/lorekit, workflow release.yml.
# ─────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    branches: [main]

permissions: {}

# Never overlap release runs on the same branch.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. Maintain the release PR / cut the release ─────────────────────────────
  release-please:
    name: Release please
    runs-on: ubuntu-latest
    # No-op until the release credentials exist. RELEASE_APP_ID is a repo
    # *variable* (not a secret) precisely so it can gate here — secrets can't be
    # read in `if:`. Before setup this job (and publish-cli, which needs it)
    # skips cleanly instead of failing red on every push to main.
    if: ${{ vars.RELEASE_APP_ID != '' }}
    permissions:
      contents: write # create tags + GitHub releases
      pull-requests: write # open/update the release PR
    outputs:
      cli_release_created: ${{ steps.rp.outputs['packages/cli--release_created'] }}
      cli_tag: ${{ steps.rp.outputs['packages/cli--tag_name'] }}
    steps:
      - name: Mint a GitHub App token (so the release PR triggers required CI)
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ── 2. Publish to npm — only when a release was actually cut ─────────────────
  publish-cli:
    name: Publish @lorekit/cli to npm
    needs: release-please
    if: needs.release-please.outputs.cli_release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mint the OIDC token npm trades for publish rights
    steps:
      - name: Checkout the release commit (version already bumped on main)
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      # Pinned, not @latest: Trusted Publishing landed in 11.5.1, and a pinned
      # version keeps the publish reproducible.
      - name: Upgrade npm for Trusted Publishing (needs >= 11.5.1)
        run: npm install -g npm@11.5.1

      - name: Test
        working-directory: packages/cli
        run: node --test test/*.test.mjs

      # Pre-publish smoke: pack the CLI and run `install` THROUGH npx into a temp
      # project, asserting the wired hooks use the `npx -y @lorekit/cli` runner
      # and never a bare `lorekit` (which only resolves inside npx's transient
      # PATH and dies with `command not found` once npx exits). A broken CLI must
      # not reach the publish step below.
      - name: Smoke-test the packaged CLI (npx install wiring)
        run: node packages/cli/test/smoke-npx-install.mjs

      # No NODE_AUTH_TOKEN: npm authenticates via the Actions OIDC trusted
      # publisher. release-please guarantees the version is new, so no guard.
      - name: Publish (Trusted Publishing / OIDC)
        working-directory: packages/cli
        run: npm publish --access public --provenance

      - name: Report publish
        run: |
          echo "### 📦 Published ${{ needs.release-please.outputs.cli_tag }} to npm" >> "$GITHUB_STEP_SUMMARY"
          echo "\`npm install -g @lorekit/cli@latest\`" >> "$GITHUB_STEP_SUMMARY"
